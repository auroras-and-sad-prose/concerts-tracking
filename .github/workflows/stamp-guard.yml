name: stamp-guard

# The routine pushes checked.json to main directly. This holds such a push to
# that one file: see .github/scripts/stamp-guard.sh.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the guard diffs against the commit before the push

      # Only GitHub's own record of which pull requests a commit belongs to
      # counts. The committer field is not used: a pusher sets it, so
      # "noreply@github.com" can be forged. GitHub links a merged commit to its
      # PR shortly after the merge, and a rebase merge has nothing else to go
      # on, so an empty answer is retried for a minute before the push is
      # treated as direct.
      - name: Did a merged pull request bring this in?
        id: merged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          merged=false
          for attempt in 1 2 3 4 5 6; do
            n=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                  --jq '[.[] | select(.merged_at != null)] | length')
            if [ "$n" -gt 0 ]; then merged=true; break; fi
            [ "$attempt" -lt 6 ] && sleep 10
          done
          echo "merged=$merged" >> "$GITHUB_OUTPUT"

      - name: Hold a direct push to checked.json
        env:
          MERGED: ${{ steps.merged.outputs.merged }}
        run: .github/scripts/stamp-guard.sh "${{ github.event.before }}" "${{ github.sha }}"
