name: validate-seen

on:
  push:
    branches: [main]
    paths: ["seen.json", "artists.json", "favorites.json", "travel.json", "tools/**", "go.mod"]
  pull_request:
    paths: ["seen.json", "artists.json", "favorites.json", "travel.json", "tools/**", "go.mod"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need history to diff against the base version

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: go test ./tools/...

      - name: Structural validation
        run: go run ./tools/validate -file seen.json

      - name: Append-only check vs base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -e
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            base="origin/$BASE_REF"
          else
            # What main pointed at before this push, not HEAD^: a push can carry
            # several commits, and against HEAD^ only the last one's changes are
            # checked, so a row deleted in an earlier commit would pass.
            base="$BEFORE"
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              # Not in the checkout after a force push; ask for it by hash.
              git fetch origin "$base" 2>/dev/null || :
            fi
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "::warning::commit before this push ($base) is unavailable; checking against HEAD^ only"
              base="HEAD^"
            fi
          fi
          echo "base: $base"
          git show "$base:seen.json" > /tmp/base-seen.json 2>/dev/null || :
          if [ -s /tmp/base-seen.json ]; then
            go run ./tools/validate -file seen.json -base /tmp/base-seen.json
          else
            echo "no base seen.json available; skipping append-only check"
          fi
