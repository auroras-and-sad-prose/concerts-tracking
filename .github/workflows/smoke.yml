name: smoke-page

on:
  push:
    branches: [main]
    paths: ["index.html", "seen.json", "artists.json", "favorites.json", "travel.json", "tests/**", "tools/favorites/testdata/**", "tools/validate/testdata/**", ".github/workflows/smoke.yml"]
  pull_request:
    paths: ["index.html", "seen.json", "artists.json", "favorites.json", "travel.json", "tests/**", "tools/favorites/testdata/**", "tools/validate/testdata/**", ".github/workflows/smoke.yml"]

# Read-only token: these jobs only check out and fetch the repo, so a
# compromised action or dependency can't push or edit anything with it.
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install
        working-directory: tests
        run: npm ci

      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        working-directory: tests
        run: npm test
