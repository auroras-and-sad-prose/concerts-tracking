<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upcoming Concerts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf7f2;
    --card-bg: #ffffff;
    --text: #221e1a;
    --muted: #837b6f;
    --border: #e8e1d5;
    --border-strong: #d9d0bf;
    --accent: #8e3b46;
    --accent-ink: #7a5a28;
    --accent-soft: #f6e9e6;
    --gold: #b18d4f;
    --gold-soft: #f3ead9;
    --chip-bg: #f6f2ea;
    --shadow: 0 1px 2px rgba(60, 45, 20, .05), 0 8px 24px -18px rgba(60, 45, 20, .35);
    --shadow-hover: 0 2px 4px rgba(60, 45, 20, .06), 0 14px 34px -18px rgba(60, 45, 20, .4);
    --serif: "Fraunces", "Iowan Old Style", Georgia, "Times New Roman", serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191612;
      --card-bg: #221e19;
      --text: #ede7dc;
      --muted: #a29a8b;
      --border: #38322a;
      --border-strong: #4a4234;
      --accent: #d78d97;
      --accent-ink: #dfa08f;
      --accent-soft: #3a2a2b;
      --gold: #cfae74;
      --gold-soft: #362e1f;
      --chip-bg: #2b2620;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -18px rgba(0, 0, 0, .7);
      --shadow-hover: 0 2px 4px rgba(0, 0, 0, .35), 0 14px 34px -18px rgba(0, 0, 0, .8);
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  header {
    max-width: 920px;
    margin: 0 auto;
    padding: 3.25rem 1.25rem 1.5rem;
    text-align: center;
  }
  .eyebrow {
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: .9rem;
  }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 420;
    font-size: clamp(2.1rem, 5.5vw, 3.1rem);
    letter-spacing: -.01em;
    line-height: 1.1;
  }
  .rule {
    width: 72px;
    margin: 1.1rem auto .9rem;
    border: 0;
    border-top: 1px solid var(--gold);
    position: relative;
  }
  .rule::after {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 2px;
    border-top: 1px solid var(--gold);
    opacity: .45;
  }
  .subtitle {
    color: var(--muted);
    font-family: var(--serif);
    font-style: italic;
    font-size: 1rem;
  }

  /* ---------- Controls ---------- */
  .controls-wrap {
    position: sticky;
    top: 0;
    z-index: 10;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .controls {
    max-width: 920px;
    margin: 0 auto;
    padding: .8rem 1.25rem;
    display: flex;
    flex-wrap: wrap;
    gap: .55rem;
  }
  .controls select, .controls input {
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: .5rem 1rem;
    font-size: .86rem;
    font-family: var(--sans);
    box-shadow: var(--shadow);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .controls select {
    appearance: none;
    -webkit-appearance: none;
    padding-right: 2.1rem;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%23837b6f' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right .9rem center;
    cursor: pointer;
  }
  .controls select:hover, .controls input:hover {
    border-color: var(--gold);
  }
  .controls select:focus, .controls input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .controls input[type="search"] {
    flex: 1;
    min-width: 170px;
  }
  .controls input[type="search"]::placeholder { color: var(--muted); }

  /* ---------- List ---------- */
  main {
    max-width: 920px;
    margin: 0 auto;
    padding: .5rem 1.25rem 4.5rem;
  }
  .month-heading {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 2.4rem 0 1rem;
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.05rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .month-heading::before, .month-heading::after {
    content: "";
    flex: 1;
    border-top: 1px solid var(--border);
  }
  .month-heading::before { max-width: 2.2rem; flex: 0 0 2.2rem; }
  .month-heading:first-of-type { margin-top: 1.4rem; }

  .card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.05rem 1.15rem;
    margin-bottom: .7rem;
    display: flex;
    gap: 1.1rem;
    align-items: flex-start;
    box-shadow: var(--shadow);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    animation: rise .35s ease both;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
    border-color: var(--border-strong);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .card:hover { transform: none; }
    html { scroll-behavior: auto; }
  }

  .date-col {
    flex: 0 0 auto;
    width: 3.7rem;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: .45rem 0 .4rem;
    background:
      linear-gradient(to bottom, var(--chip-bg), transparent 55%);
  }
  .date-col .mon {
    font-size: .62rem;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .date-col .day {
    font-family: var(--serif);
    font-size: 1.55rem;
    font-weight: 500;
    line-height: 1.15;
  }
  .date-col .dow {
    font-size: .62rem;
    letter-spacing: .1em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .card .body { flex: 1; min-width: 0; }
  .card .topline {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: .3rem .5rem;
  }
  .card .artist {
    font-family: var(--serif);
    font-size: 1.22rem;
    font-weight: 520;
    letter-spacing: .005em;
    color: var(--text);
  }
  .card .place {
    font-size: .88rem;
    color: var(--muted);
    margin-top: .28rem;
  }
  .card .place .city { color: var(--text); font-weight: 500; }
  .card .program {
    font-size: .84rem;
    color: var(--muted);
    margin-top: .45rem;
  }
  .card .repertoire { margin-top: .6rem; }
  .card .repertoire-label {
    display: block;
    font-size: .64rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .16em;
    color: var(--gold);
    margin-bottom: .4rem;
  }
  .card .repertoire-list {
    display: flex;
    flex-wrap: wrap;
    gap: .4rem;
  }
  .card .piece {
    font-size: .78rem;
    line-height: 1.35;
    padding: .22rem .7rem;
    border-radius: 999px;
    background: var(--chip-bg);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .card .repertoire.note .repertoire-text {
    display: block;
    font-family: var(--serif);
    font-style: italic;
    font-size: .88rem;
    color: var(--muted);
  }
  .card a.link {
    align-self: flex-start;
    font-size: .78rem;
    font-weight: 500;
    text-decoration: none;
    color: var(--accent);
    white-space: nowrap;
    border: 1px solid transparent;
    border-radius: 999px;
    padding: .28rem .7rem;
    margin: -.1rem -.3rem 0 0;
    transition: background .15s ease, border-color .15s ease;
  }
  .card a.link:hover {
    background: var(--accent-soft);
    border-color: var(--border);
  }

  /* ---------- Tags ---------- */
  .tag {
    display: inline-block;
    font-size: .66rem;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    border-radius: 999px;
    padding: .16rem .6rem;
    vertical-align: middle;
    background: var(--chip-bg);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .tag.loc-berlin {
    background: var(--accent-soft);
    border-color: transparent;
    color: var(--accent);
  }
  .tag.loc-germany {
    background: var(--gold-soft);
    border-color: transparent;
    color: var(--accent-ink);
  }
  .tag.instrument {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .empty, .loading {
    color: var(--muted);
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.05rem;
    padding: 3.5rem 0;
    text-align: center;
  }

  footer {
    max-width: 920px;
    margin: 0 auto;
    padding: 0 1.25rem 2.5rem;
    text-align: center;
    color: var(--muted);
    font-size: .78rem;
  }
  footer .fleuron {
    font-family: var(--serif);
    font-size: 1rem;
    color: var(--gold);
    display: block;
    margin-bottom: .4rem;
  }

  @media (max-width: 560px) {
    .card { padding: .9rem .9rem; gap: .85rem; }
    .date-col { width: 3.3rem; }
    .card .artist { font-size: 1.1rem; }
    .card a.link {
      position: absolute;
      top: .7rem;
      right: .7rem;
    }
  }
</style>
</head>
<body>
<header>
  <div class="eyebrow">Concert Watch</div>
  <h1>Upcoming Concerts</h1>
  <hr class="rule">
  <div class="subtitle" id="subtitle">Loading…</div>
</header>

<div class="controls-wrap">
  <div class="controls">
    <select id="artistFilter" aria-label="Filter by artist"><option value="">All artists</option></select>
    <select id="instrumentFilter" hidden aria-label="Filter by instrument"><option value="">All instruments</option></select>
    <select id="countryFilter" aria-label="Filter by country"><option value="">All countries</option></select>
    <input type="search" id="searchBox" placeholder="Search city, venue, programme…" aria-label="Search concerts">
  </div>
</div>

<main id="main">
  <div class="loading">Loading concerts…</div>
</main>

<footer>
  <span class="fleuron">❦</span>
  Curated from the artists’ own calendars and Bachtrack.
</footer>

<script>
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTH = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let allConcerts = [];

// Which instruments each artist plays, from artists.json. That roster is
// curated and static — an instrument is a fact about the performer, not about
// one concert — so it lives outside seen.json and is joined in here by artist
// name, which CI guarantees matches the roster exactly.
let instrumentsByName = new Map();

function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function loadRoster(artists) {
  instrumentsByName = new Map();
  for (const a of artists) {
    if (a.name && Array.isArray(a.instruments)) {
      instrumentsByName.set(a.name, a.instruments.filter(i => typeof i === "string" && i.trim()));
    }
  }
}

// Every instrument the artist plays, from the roster.
function rosterInstrumentsOf(concert) {
  return instrumentsByName.get(concert.artist) || [];
}

// What this row itself says the engagement calls for — often nothing, since
// most listings don't mention it.
function statedInstrumentsOf(concert) {
  return Array.isArray(concert.instruments)
    ? concert.instruments.filter(i => typeof i === "string" && i.trim())
    : [];
}

// The instruments a concert counts as. A row that names its own narrows the
// roster to those; one that doesn't matches every instrument its artist plays,
// so an unstated Fischer date shows under both Piano and Violin rather than
// disappearing from the filter or pretending to know which it was.
function instrumentsOf(concert) {
  const stated = statedInstrumentsOf(concert);
  return stated.length ? stated : rosterInstrumentsOf(concert);
}

// Shown only for artists who play more than one instrument — that is where the
// row-level detail answers a real question. For a pianist it would just repeat
// what the name already tells you.
function instrumentTagsHTML(concert) {
  if (rosterInstrumentsOf(concert).length < 2) return "";
  return statedInstrumentsOf(concert)
    .map(i => `<span class="tag instrument">${escapeHTML(i)}</span>`)
    .join("");
}

function titleCase(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function addOptions(selectId, values, label = v => v) {
  const sel = document.getElementById(selectId);
  for (const v of [...new Set(values)].sort()) {
    const opt = document.createElement("option");
    opt.value = v; opt.textContent = label(v);
    sel.appendChild(opt);
  }
  return sel;
}

function populateFilters(concerts) {
  addOptions("artistFilter", concerts.map(c => c.artist));
  // Stays hidden when the roster is unavailable or tells us nothing, so the
  // page still works with only seen.json rather than showing a dead control.
  const instrumentSel = addOptions("instrumentFilter", concerts.flatMap(instrumentsOf), titleCase);
  instrumentSel.hidden = instrumentSel.options.length <= 1;
  addOptions("countryFilter", concerts.map(c => c.country).filter(Boolean));
}

// The location tag doubles as a color class so Berlin and Germany dates stand
// out from the rest of Europe at a glance; the class list is closed by CI's
// location_tag allowlist.
function locationTagHTML(tag) {
  if (!tag) return "";
  const cls = tag === "berlin" ? "loc-berlin" : tag === "germany" ? "loc-germany" : "loc-europe";
  return `<span class="tag ${cls}">${escapeHTML(tag)}</span>`;
}

function render() {
  const artist = document.getElementById("artistFilter").value;
  const instrument = document.getElementById("instrumentFilter").value;
  const country = document.getElementById("countryFilter").value;
  const search = document.getElementById("searchBox").value.trim().toLowerCase();
  const today = todayISO();

  let list = allConcerts.filter(c => c.date >= today);
  if (artist) list = list.filter(c => c.artist === artist);
  if (instrument) list = list.filter(c => instrumentsOf(c).includes(instrument));
  if (country) list = list.filter(c => c.country === country);
  if (search) {
    list = list.filter(c =>
      (c.city || "").toLowerCase().includes(search) ||
      (c.venue || "").toLowerCase().includes(search) ||
      (c.program || "").toLowerCase().includes(search) ||
      piecesText(c.pieces).toLowerCase().includes(search) ||
      (c.artist || "").toLowerCase().includes(search)
    );
  }
  list.sort((a, b) => a.date.localeCompare(b.date));

  const main = document.getElementById("main");
  document.getElementById("subtitle").textContent =
    `${list.length} upcoming concert${list.length === 1 ? "" : "s"}`;

  if (list.length === 0) {
    main.innerHTML = '<div class="empty">No upcoming concerts match your filters.</div>';
    return;
  }

  let html = "";
  let lastMonthKey = "";
  let i = 0;
  for (const c of list) {
    const d = new Date(c.date + "T00:00:00");
    const monthKey = `${MONTH[d.getMonth()]} ${d.getFullYear()}`;
    if (monthKey !== lastMonthKey) {
      html += `<div class="month-heading">${monthKey}</div>`;
      lastMonthKey = monthKey;
    }
    const wherePieces = [c.venue, c.country].filter(Boolean);
    const whereHTML = [
      c.city ? `<span class="city">${escapeHTML(c.city)}</span>` : "",
      ...wherePieces.map(escapeHTML)
    ].filter(Boolean).join(" · ");
    const safeUrl = isSafeUrl(c.source_url) ? c.source_url : null;
    // Stagger the entrance animation slightly, capped so long lists don't lag.
    const delay = Math.min(i++, 12) * 25;
    html += `
      <div class="card" style="animation-delay:${delay}ms">
        <div class="date-col">
          <div class="mon">${MONTH_ABBR[d.getMonth()]}</div>
          <div class="day">${d.getDate()}</div>
          <div class="dow">${DOW[d.getDay()]}</div>
        </div>
        <div class="body">
          <div class="topline"><span class="artist">${escapeHTML(c.artist)}</span>${locationTagHTML(c.location_tag)}${instrumentTagsHTML(c)}</div>
          <div class="place">${whereHTML}</div>
          ${c.program ? `<div class="program">${escapeHTML(c.program)}</div>` : ""}
          ${piecesHTML(c.pieces)}
        </div>
        ${safeUrl ? `<a class="link" href="${escapeHTML(safeUrl)}" target="_blank" rel="noopener">Source ↗</a>` : ""}
      </div>`;
  }
  main.innerHTML = html;
}

// `pieces` is an array of work titles when the repertoire is known, or a
// descriptive string ("Programme not announced") when the source doesn't list
// it. Both get the same "Programme" label so it's always clear what this line
// represents; the two shapes are then styled differently — confirmed works
// read as a row of pill chips, a note reads (italic, muted) as prose.
function piecesHTML(pieces) {
  if (Array.isArray(pieces)) {
    const items = pieces.filter(p => typeof p === "string" && p.trim());
    if (items.length === 0) return "";
    const chips = items.map(p => `<span class="piece">${escapeHTML(p)}</span>`).join("");
    return `<div class="repertoire"><span class="repertoire-label">Programme</span><div class="repertoire-list">${chips}</div></div>`;
  }
  if (typeof pieces === "string" && pieces.trim()) {
    return `<div class="repertoire note"><span class="repertoire-label">Programme</span><span class="repertoire-text">${escapeHTML(pieces)}</span></div>`;
  }
  return "";
}

function piecesText(pieces) {
  if (Array.isArray(pieces)) return pieces.filter(p => typeof p === "string").join(" ");
  return typeof pieces === "string" ? pieces : "";
}

function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, s => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[s]));
}

function isSafeUrl(url) {
  if (typeof url !== "string") return false;
  try {
    const parsed = new URL(url, window.location.href);
    return parsed.protocol === "http:" || parsed.protocol === "https:";
  } catch {
    return false;
  }
}

async function fetchJSON(path) {
  const res = await fetch(path, { cache: "no-store" });
  if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
  return res.json();
}

async function init() {
  // The roster is supporting data: if it can't be loaded, the concert list
  // still renders and only the instrument filter drops out.
  const roster = fetchJSON("artists.json").catch(e => {
    console.error(e);
    return null;
  });
  try {
    const data = await fetchJSON("seen.json");
    allConcerts = data.concerts || [];
    const artists = await roster;
    loadRoster((artists && artists.artists) || []);
    populateFilters(allConcerts);
    render();
  } catch (e) {
    document.getElementById("main").innerHTML =
      '<div class="empty">Could not load seen.json.</div>';
    document.getElementById("subtitle").textContent = "Error";
    console.error(e);
  }
}

document.getElementById("artistFilter").addEventListener("change", render);
document.getElementById("instrumentFilter").addEventListener("change", render);
document.getElementById("countryFilter").addEventListener("change", render);
document.getElementById("searchBox").addEventListener("input", render);

init();
</script>
</body>
</html>
