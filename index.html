<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upcoming Concerts</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e3e3e6;
    --accent: #6b4fbb;
    --accent-soft: #efeaf9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --card-bg: #1f1f24;
      --text: #eee;
      --muted: #9a9aa2;
      --border: #303038;
      --accent: #a48ee8;
      --accent-soft: #2a2440;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.25rem 1rem;
  }
  h1 {
    margin: 0 0 .25rem;
    font-size: 1.6rem;
  }
  .subtitle {
    color: var(--muted);
    font-size: .9rem;
  }
  .controls {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.25rem 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: .6rem;
  }
  .controls select, .controls input {
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .5rem .7rem;
    font-size: .9rem;
  }
  .controls input[type="search"] {
    flex: 1;
    min-width: 160px;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.25rem 3rem;
  }
  .month-heading {
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin: 1.75rem 0 .6rem;
  }
  .month-heading:first-of-type {
    margin-top: .5rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: .9rem 1rem;
    margin-bottom: .6rem;
    display: flex;
    gap: 1rem;
    align-items: baseline;
  }
  .card .date-col {
    flex: 0 0 auto;
    width: 3.4rem;
    text-align: center;
  }
  .date-col .day {
    font-size: 1.3rem;
    font-weight: 600;
    line-height: 1;
  }
  .date-col .dow {
    font-size: .7rem;
    color: var(--muted);
    text-transform: uppercase;
  }
  .card .body {
    flex: 1;
    min-width: 0;
  }
  .card .artist {
    font-weight: 600;
    color: var(--accent);
  }
  .card .place {
    font-size: .9rem;
    color: var(--text);
    margin-top: .15rem;
  }
  .card .program {
    font-size: .82rem;
    color: var(--muted);
    margin-top: .3rem;
  }
  .card .repertoire {
    margin-top: .5rem;
  }
  .card .repertoire-label {
    display: block;
    font-size: .68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--accent);
    margin-bottom: .35rem;
  }
  .card .repertoire-list {
    display: flex;
    flex-wrap: wrap;
    gap: .4rem;
  }
  .card .piece {
    font-size: .78rem;
    line-height: 1.3;
    padding: .2rem .65rem;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .card .repertoire.note .repertoire-text {
    display: block;
    font-size: .82rem;
    color: var(--muted);
    font-style: italic;
  }
  .card a.link {
    font-size: .8rem;
    text-decoration: none;
    color: var(--accent);
    white-space: nowrap;
  }
  .tag {
    display: inline-block;
    font-size: .7rem;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 999px;
    padding: .1rem .55rem;
    margin-left: .4rem;
    vertical-align: middle;
  }
  .empty, .loading {
    color: var(--muted);
    padding: 2rem 0;
    text-align: center;
  }
</style>
</head>
<body>
<header>
  <h1>Upcoming Concerts</h1>
  <div class="subtitle" id="subtitle">Loading…</div>
</header>

<div class="controls">
  <select id="artistFilter"><option value="">All artists</option></select>
  <select id="instrumentFilter" hidden><option value="">All instruments</option></select>
  <select id="countryFilter"><option value="">All countries</option></select>
  <input type="search" id="searchBox" placeholder="Search city, venue, program, pieces…">
</div>

<main id="main">
  <div class="loading">Loading concerts…</div>
</main>

<script>
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTH = ["January","February","March","April","May","June","July","August","September","October","November","December"];

let allConcerts = [];

// Which instruments each artist plays, from artists.json. That roster is
// curated and static — an instrument is a fact about the performer, not about
// one concert — so it lives outside seen.json and is joined in here by artist
// name (with the concert id's slug as a fallback).
let instrumentsByName = new Map();
let instrumentsBySlug = new Map();

function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function loadRoster(artists) {
  instrumentsByName = new Map();
  instrumentsBySlug = new Map();
  for (const a of artists) {
    if (!Array.isArray(a.instruments)) continue;
    const list = a.instruments.filter(i => typeof i === "string" && i.trim());
    if (a.name) instrumentsByName.set(a.name, list);
    if (a.slug) instrumentsBySlug.set(a.slug, list);
  }
}

function instrumentsOf(concert) {
  return instrumentsByName.get(concert.artist)
    || instrumentsBySlug.get(String(concert.id || "").split("|")[0])
    || [];
}

function titleCase(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function populateFilters(concerts) {
  const artistSel = document.getElementById("artistFilter");
  const instrumentSel = document.getElementById("instrumentFilter");
  const countrySel = document.getElementById("countryFilter");
  const artists = [...new Set(concerts.map(c => c.artist))].sort();
  const instruments = [...new Set(concerts.flatMap(instrumentsOf))].sort();
  const countries = [...new Set(concerts.map(c => c.country).filter(Boolean))].sort();
  for (const a of artists) {
    const opt = document.createElement("option");
    opt.value = a; opt.textContent = a;
    artistSel.appendChild(opt);
  }
  for (const i of instruments) {
    const opt = document.createElement("option");
    opt.value = i; opt.textContent = titleCase(i);
    instrumentSel.appendChild(opt);
  }
  // Stays hidden when the roster is unavailable or tells us nothing, so the
  // page still works with only seen.json rather than showing a dead control.
  instrumentSel.hidden = instruments.length === 0;
  for (const c of countries) {
    const opt = document.createElement("option");
    opt.value = c; opt.textContent = c;
    countrySel.appendChild(opt);
  }
}

function render() {
  const artist = document.getElementById("artistFilter").value;
  const instrument = document.getElementById("instrumentFilter").value;
  const country = document.getElementById("countryFilter").value;
  const search = document.getElementById("searchBox").value.trim().toLowerCase();
  const today = todayISO();

  let list = allConcerts.filter(c => c.date >= today);
  if (artist) list = list.filter(c => c.artist === artist);
  if (instrument) list = list.filter(c => instrumentsOf(c).includes(instrument));
  if (country) list = list.filter(c => c.country === country);
  if (search) {
    list = list.filter(c =>
      (c.city || "").toLowerCase().includes(search) ||
      (c.venue || "").toLowerCase().includes(search) ||
      (c.program || "").toLowerCase().includes(search) ||
      piecesText(c.pieces).toLowerCase().includes(search) ||
      (c.artist || "").toLowerCase().includes(search)
    );
  }
  list.sort((a, b) => a.date.localeCompare(b.date));

  const main = document.getElementById("main");
  document.getElementById("subtitle").textContent =
    `${list.length} upcoming concert${list.length === 1 ? "" : "s"}`;

  if (list.length === 0) {
    main.innerHTML = '<div class="empty">No upcoming concerts match your filters.</div>';
    return;
  }

  let html = "";
  let lastMonthKey = "";
  for (const c of list) {
    const d = new Date(c.date + "T00:00:00");
    const monthKey = `${MONTH[d.getMonth()]} ${d.getFullYear()}`;
    if (monthKey !== lastMonthKey) {
      html += `<div class="month-heading">${monthKey}</div>`;
      lastMonthKey = monthKey;
    }
    const place = [c.venue, c.city, c.country].filter(Boolean).join(", ");
    const safeUrl = isSafeUrl(c.source_url) ? c.source_url : null;
    html += `
      <div class="card">
        <div class="date-col">
          <div class="day">${d.getDate()}</div>
          <div class="dow">${DOW[d.getDay()]}</div>
        </div>
        <div class="body">
          <div><span class="artist">${escapeHTML(c.artist)}</span>${c.location_tag ? `<span class="tag">${escapeHTML(c.location_tag)}</span>` : ""}</div>
          <div class="place">${escapeHTML(place)}</div>
          ${c.program ? `<div class="program">${escapeHTML(c.program)}</div>` : ""}
          ${piecesHTML(c.pieces)}
        </div>
        ${safeUrl ? `<a class="link" href="${escapeHTML(safeUrl)}" target="_blank" rel="noopener">Source →</a>` : ""}
      </div>`;
  }
  main.innerHTML = html;
}

// `pieces` is an array of work titles when the repertoire is known, or a
// descriptive string ("Programme not announced") when the source doesn't list
// it. Both get the same "Programme" label so it's always clear what this line
// represents; the two shapes are then styled differently — confirmed works
// read as a row of pill chips, a note reads (italic, muted) as prose.
function piecesHTML(pieces) {
  if (Array.isArray(pieces)) {
    const items = pieces.filter(p => typeof p === "string" && p.trim());
    if (items.length === 0) return "";
    const chips = items.map(p => `<span class="piece">${escapeHTML(p)}</span>`).join("");
    return `<div class="repertoire"><span class="repertoire-label">Programme</span><div class="repertoire-list">${chips}</div></div>`;
  }
  if (typeof pieces === "string" && pieces.trim()) {
    return `<div class="repertoire note"><span class="repertoire-label">Programme</span><span class="repertoire-text">${escapeHTML(pieces)}</span></div>`;
  }
  return "";
}

function piecesText(pieces) {
  if (Array.isArray(pieces)) return pieces.filter(p => typeof p === "string").join(" ");
  return typeof pieces === "string" ? pieces : "";
}

function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, s => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[s]));
}

function isSafeUrl(url) {
  if (typeof url !== "string") return false;
  try {
    const parsed = new URL(url, window.location.href);
    return parsed.protocol === "http:" || parsed.protocol === "https:";
  } catch {
    return false;
  }
}

async function fetchJSON(path) {
  const res = await fetch(path, { cache: "no-store" });
  if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
  return res.json();
}

async function init() {
  // The roster is supporting data: if it can't be loaded, the concert list
  // still renders and only the instrument filter drops out.
  const roster = fetchJSON("artists.json").catch(e => {
    console.error(e);
    return null;
  });
  try {
    const data = await fetchJSON("seen.json");
    allConcerts = data.concerts || [];
    const artists = await roster;
    loadRoster((artists && artists.artists) || []);
    populateFilters(allConcerts);
    render();
  } catch (e) {
    document.getElementById("main").innerHTML =
      '<div class="empty">Could not load seen.json.</div>';
    document.getElementById("subtitle").textContent = "Error";
    console.error(e);
  }
}

document.getElementById("artistFilter").addEventListener("change", render);
document.getElementById("instrumentFilter").addEventListener("change", render);
document.getElementById("countryFilter").addEventListener("change", render);
document.getElementById("searchBox").addEventListener("input", render);

init();
</script>
</body>
</html>
