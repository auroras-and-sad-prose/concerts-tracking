<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upcoming Concerts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,400..700;1,400..600&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  /* Newspaper typographic split: a serif carries the "headline" elements —
     page title, month, artist name, day numeral — while a Franklin-style sans
     carries every piece of interface text. Both stacks fall back to widely
     installed faces so the page still reads correctly if the webfonts fail. */
  :root {
    color-scheme: light dark;
    --serif: "PT Serif", Georgia, "Times New Roman", serif;
    --sans: "Libre Franklin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

    --bg: #f5f7fa;
    --card-bg: #ffffff;
    --text: #151b26;
    --muted: #667085;
    --faint: #98a1b3;
    --border: #e4e8ef;
    --border-strong: #cfd6e2;
    --accent: #24548c;
    --accent-soft: #e8eff8;
    --on-accent: #ffffff;
    --chip-bg: #eef1f6;
    --alert: #a3282d;
    --alert-soft: #fbe9e9;
    --shadow: 0 1px 2px rgba(21, 27, 38, .04);
    --shadow-hover: 0 8px 24px -16px rgba(21, 27, 38, .45);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --card-bg: #191d25;
      --text: #e9ecf2;
      --muted: #97a0b1;
      --faint: #6f7889;
      --border: #262c37;
      --border-strong: #39414f;
      --accent: #86b4e8;
      --accent-soft: #1c2a3c;
      --on-accent: #0f151d;
      --chip-bg: #212734;
      --alert: #f08a8f;
      --alert-soft: #3a1f22;
      --shadow: 0 1px 2px rgba(0, 0, 0, .35);
      --shadow-hover: 0 8px 24px -16px rgba(0, 0, 0, .85);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* ---------- Masthead ---------- */
  header { max-width: 860px; margin: 0 auto; padding: 3.5rem 1.5rem 1.25rem; }
  .eyebrow {
    font-size: .7rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
    color: var(--accent); margin-bottom: .85rem;
  }
  h1 {
    margin: 0;
    font-family: var(--serif); font-weight: 700;
    font-size: clamp(2rem, 5vw, 2.6rem);
    letter-spacing: -.012em; line-height: 1.06;
  }
  .subtitle { margin-top: .5rem; color: var(--muted); font-size: .92rem; }

  /* ---------- Filters ---------- */
  .controls-wrap {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .controls {
    max-width: 860px; margin: 0 auto;
    padding: .85rem 1.5rem;
    display: flex; flex-wrap: wrap; gap: .45rem;
  }
  .controls select, .controls input {
    background: var(--card-bg); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: 8px;
    padding: .45rem .75rem; font-size: .85rem; font-family: var(--sans);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .controls select {
    appearance: none; -webkit-appearance: none;
    padding-right: 1.9rem; cursor: pointer;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%23667085' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right .7rem center;
  }
  .controls select option { background: var(--card-bg); color: var(--text); }
  .controls select:hover, .controls input:hover { border-color: var(--faint); }
  .controls select:focus-visible, .controls input:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .controls input[type="search"] { flex: 1; min-width: 170px; }
  .controls input[type="search"]::placeholder { color: var(--faint); }

  /* ---------- Listing ---------- */
  main { max-width: 860px; margin: 0 auto; padding: .5rem 1.5rem 5rem; }
  .month-heading {
    margin: 2.4rem 0 .8rem;
    font-family: var(--serif); font-weight: 700;
    font-size: 1.12rem; letter-spacing: -.005em;
  }
  .month-heading:first-of-type { margin-top: 1.1rem; }

  .card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: .95rem 1.1rem;
    margin-bottom: .45rem;
    display: flex; gap: 1.1rem; align-items: flex-start;
    box-shadow: var(--shadow);
    transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .card:hover {
    border-color: var(--border-strong);
    box-shadow: var(--shadow-hover);
    transform: translateY(-1px);
  }

  .date-col {
    flex: 0 0 auto; width: 3.4rem; text-align: center;
    border: 1px solid var(--border); border-radius: 8px;
    padding: .35rem 0 .3rem;
    background: var(--chip-bg);
    font-variant-numeric: tabular-nums;
  }
  .date-col .mon { font-size: .6rem; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; color: var(--accent); }
  .date-col .day { font-family: var(--serif); font-weight: 700; font-size: 1.42rem; letter-spacing: -.01em; line-height: 1.12; }
  .date-col .dow { font-size: .6rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }

  .card .body { flex: 1; min-width: 0; }
  .card .topline { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .55rem; }
  .card .artist {
    font-family: var(--serif); font-weight: 700;
    font-size: 1.16rem; letter-spacing: -.003em;
  }
  .card .place { font-size: .86rem; color: var(--muted); margin-top: .2rem; }
  .card .place .city { color: var(--text); font-weight: 600; }
  .card .program { font-size: .82rem; color: var(--muted); margin-top: .4rem; line-height: 1.45; max-width: 62ch; }

  .card .repertoire { margin-top: .55rem; }
  .card .repertoire-label {
    display: block; font-size: .6rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .14em;
    color: var(--faint); margin-bottom: .32rem;
  }
  .card .repertoire-list { display: flex; flex-wrap: wrap; gap: .32rem; }
  .card .piece {
    font-size: .77rem; line-height: 1.35; font-weight: 500;
    padding: .18rem .55rem; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent);
  }
  .card .repertoire.note .repertoire-text {
    display: block; font-family: var(--serif); font-style: italic;
    font-size: .89rem; color: var(--muted);
  }

  /* A card carries up to two links: the calendar it was found on, and the
     concert's own page when the calendar linked to one. */
  .card .links {
    align-self: center; flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: flex-end; gap: .1rem;
  }
  .card a.link {
    font-size: .78rem; font-weight: 600; text-decoration: none;
    color: var(--accent); white-space: nowrap;
    border-radius: 6px; padding: .3rem .55rem;
    transition: background .15s ease;
  }
  .card a.link:hover { background: var(--accent-soft); }
  .card a.link.secondary { font-weight: 500; color: var(--muted); }
  .card a.link.secondary:hover { color: var(--accent); }

  /* ---------- Tags ---------- */
  .tag {
    display: inline-block;
    font-size: .65rem; font-weight: 600; letter-spacing: .03em;
    border-radius: 5px; padding: .13rem .45rem;
    background: var(--chip-bg); color: var(--muted);
  }
  .tag.loc-berlin { background: var(--accent); color: var(--on-accent); }
  .tag.loc-germany { background: var(--accent-soft); color: var(--accent); }
  .tag.loc-europe { background: var(--chip-bg); color: var(--faint); }
  .tag.instrument { background: transparent; color: var(--faint); box-shadow: inset 0 0 0 1px var(--border-strong); }
  /* card-bg, not white: the alert red flips light in dark mode, and the label
     has to stay legible on both. */
  .tag.status { background: var(--alert); color: var(--card-bg); text-transform: uppercase; letter-spacing: .06em; }

  /* A concert that is off, moved, or handed to another soloist stays on the
     page — the row can never be deleted, and a reader who has tickets needs to
     see why. It is marked instead: a red edge, muted text, and the source's own
     words for what happened. */
  .card.flagged { border-left: 3px solid var(--alert); }
  .card.flagged .artist { text-decoration: line-through; text-decoration-color: var(--alert); }
  .card.flagged .repertoire, .card.flagged .program { color: var(--faint); }
  .card .status-line {
    margin-top: .45rem; padding: .35rem .55rem; border-radius: 6px;
    background: var(--alert-soft); color: var(--alert);
    font-size: .8rem; line-height: 1.45; max-width: 62ch;
  }

  .empty, .loading { color: var(--muted); padding: 4rem 0; text-align: center; font-size: .95rem; }
  footer { max-width: 860px; margin: 0 auto; padding: 0 1.5rem 3rem; color: var(--faint); font-size: .78rem; }

  @media (max-width: 560px) {
    header { padding-top: 2.5rem; }
    .card { padding: .9rem .95rem; gap: .85rem; flex-wrap: wrap; }
    .date-col { width: 3rem; }
    /* Too narrow to keep a column of links beside the text: they wrap onto
       their own row under the card instead. */
    .card .links {
      flex-direction: row; justify-content: flex-end;
      width: 100%; gap: .2rem; margin-top: .15rem;
    }
    .card a.link { padding: .25rem .4rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body>
<header>
  <div class="eyebrow">Concert Watch</div>
  <h1>Upcoming Concerts</h1>
  <div class="subtitle" id="subtitle">Loading…</div>
</header>

<div class="controls-wrap">
  <div class="controls">
    <select id="artistFilter" aria-label="Filter by artist"><option value="">All artists</option></select>
    <select id="instrumentFilter" hidden aria-label="Filter by instrument"><option value="">All instruments</option></select>
    <select id="countryFilter" aria-label="Filter by country"><option value="">All countries</option></select>
    <input type="search" id="searchBox" placeholder="Search city, venue, programme…" aria-label="Search concerts">
  </div>
</div>

<main id="main">
  <div class="loading">Loading concerts…</div>
</main>

<footer>Curated from the artists’ own calendars and Bachtrack.</footer>

<script>
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTH = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let allConcerts = [];

// Which instruments each artist plays, from artists.json. That roster is
// curated and static — an instrument is a fact about the performer, not about
// one concert — so it lives outside seen.json and is joined in here by artist
// name, which CI guarantees matches the roster exactly.
let instrumentsByName = new Map();

function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function loadRoster(artists) {
  instrumentsByName = new Map();
  for (const a of artists) {
    if (a.name && Array.isArray(a.instruments)) {
      instrumentsByName.set(a.name, a.instruments.filter(i => typeof i === "string" && i.trim()));
    }
  }
}

// Every instrument the artist plays, from the roster.
function rosterInstrumentsOf(concert) {
  return instrumentsByName.get(concert.artist) || [];
}

// What this row itself says the engagement calls for — often nothing, since
// most listings don't mention it.
function statedInstrumentsOf(concert) {
  return Array.isArray(concert.instruments)
    ? concert.instruments.filter(i => typeof i === "string" && i.trim())
    : [];
}

// The instruments a concert counts as. A row that names its own narrows the
// roster to those; one that doesn't matches every instrument its artist plays,
// so an unstated Fischer date shows under both Piano and Violin rather than
// disappearing from the filter or pretending to know which it was.
function instrumentsOf(concert) {
  const stated = statedInstrumentsOf(concert);
  return stated.length ? stated : rosterInstrumentsOf(concert);
}

// Shown only for artists who play more than one instrument — that is where the
// row-level detail answers a real question. For a pianist it would just repeat
// what the name already tells you.
function instrumentTagsHTML(concert) {
  if (rosterInstrumentsOf(concert).length < 2) return "";
  return statedInstrumentsOf(concert)
    .map(i => `<span class="tag instrument">${escapeHTML(i)}</span>`)
    .join("");
}

function titleCase(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function addOptions(selectId, values, label = v => v) {
  const sel = document.getElementById(selectId);
  for (const v of [...new Set(values)].sort()) {
    const opt = document.createElement("option");
    opt.value = v; opt.textContent = label(v);
    sel.appendChild(opt);
  }
  return sel;
}

function populateFilters(concerts) {
  addOptions("artistFilter", concerts.map(c => c.artist));
  // Stays hidden when the roster is unavailable or tells us nothing, so the
  // page still works with only seen.json rather than showing a dead control.
  const instrumentSel = addOptions("instrumentFilter", concerts.flatMap(instrumentsOf), titleCase);
  instrumentSel.hidden = instrumentSel.options.length <= 1;
  addOptions("countryFilter", concerts.map(c => c.country).filter(Boolean));
}

// The location tag doubles as a colour class so Berlin and Germany dates stand
// out from the rest of Europe at a glance; the class list is closed by CI's
// location_tag allowlist.
// `status` says a listed concert is no longer the concert this row describes —
// called off, moved, or handed to another soloist — and `status_note` carries
// the source's own words for it. Both are null on a concert that is simply on.
function statusLabel(status) {
  return titleCase(String(status).replace(/_/g, " "));
}

function statusTagHTML(concert) {
  if (!concert.status) return "";
  return `<span class="tag status">${escapeHTML(statusLabel(concert.status))}</span>`;
}

function statusLineHTML(concert) {
  if (!concert.status) return "";
  const note = typeof concert.status_note === "string" ? concert.status_note.trim() : "";
  return `<div class="status-line">${escapeHTML(note || statusLabel(concert.status))}</div>`;
}

function locationTagHTML(tag) {
  if (!tag) return "";
  const cls = tag === "berlin" ? "loc-berlin" : tag === "germany" ? "loc-germany" : "loc-europe";
  return `<span class="tag ${cls}">${escapeHTML(tag)}</span>`;
}

function render() {
  const artist = document.getElementById("artistFilter").value;
  const instrument = document.getElementById("instrumentFilter").value;
  const country = document.getElementById("countryFilter").value;
  const search = document.getElementById("searchBox").value.trim().toLowerCase();
  const today = todayISO();

  let list = allConcerts.filter(c => c.date >= today);
  if (artist) list = list.filter(c => c.artist === artist);
  if (instrument) list = list.filter(c => instrumentsOf(c).includes(instrument));
  if (country) list = list.filter(c => c.country === country);
  if (search) {
    list = list.filter(c =>
      (c.city || "").toLowerCase().includes(search) ||
      (c.venue || "").toLowerCase().includes(search) ||
      (c.program || "").toLowerCase().includes(search) ||
      piecesText(c.pieces).toLowerCase().includes(search) ||
      (c.artist || "").toLowerCase().includes(search) ||
      (c.status_note || "").toLowerCase().includes(search)
    );
  }
  list.sort((a, b) => a.date.localeCompare(b.date));

  const main = document.getElementById("main");
  document.getElementById("subtitle").textContent =
    `${list.length} upcoming concert${list.length === 1 ? "" : "s"}`;

  if (list.length === 0) {
    main.innerHTML = '<div class="empty">No upcoming concerts match your filters.</div>';
    return;
  }

  let html = "";
  let lastMonthKey = "";
  for (const c of list) {
    const d = new Date(c.date + "T00:00:00");
    const monthKey = `${MONTH[d.getMonth()]} ${d.getFullYear()}`;
    if (monthKey !== lastMonthKey) {
      html += `<div class="month-heading">${monthKey}</div>`;
      lastMonthKey = monthKey;
    }
    // City leads and is emphasised — it is what you scan for — with venue and
    // country trailing it.
    const whereHTML = [
      c.city ? `<span class="city">${escapeHTML(c.city)}</span>` : "",
      ...[c.venue, c.country].filter(Boolean).map(escapeHTML)
    ].filter(Boolean).join(" · ");
    const safeUrl = isSafeUrl(c.source_url) ? c.source_url : null;
    // The detail page is where a programme missing from the calendar came
    // from, so it is worth offering alongside the source — but only when it
    // is somewhere else than the source itself.
    const detailUrl = isSafeUrl(c.detail_url) && c.detail_url !== c.source_url ? c.detail_url : null;
    const linksHTML = [
      safeUrl ? `<a class="link" href="${escapeHTML(safeUrl)}" target="_blank" rel="noopener">Source ↗</a>` : "",
      detailUrl ? `<a class="link secondary" href="${escapeHTML(detailUrl)}" target="_blank" rel="noopener">Details ↗</a>` : ""
    ].filter(Boolean).join("");
    html += `
      <div class="card${c.status ? " flagged" : ""}">
        <div class="date-col">
          <div class="mon">${MONTH_ABBR[d.getMonth()]}</div>
          <div class="day">${d.getDate()}</div>
          <div class="dow">${DOW[d.getDay()]}</div>
        </div>
        <div class="body">
          <div class="topline"><span class="artist">${escapeHTML(c.artist)}</span>${statusTagHTML(c)}${locationTagHTML(c.location_tag)}${instrumentTagsHTML(c)}</div>
          <div class="place">${whereHTML}</div>
          ${statusLineHTML(c)}
          ${c.program ? `<div class="program">${escapeHTML(c.program)}</div>` : ""}
          ${piecesHTML(c.pieces)}
        </div>
        ${linksHTML ? `<div class="links">${linksHTML}</div>` : ""}
      </div>`;
  }
  main.innerHTML = html;
}

// `pieces` is an array of work titles when the repertoire is known, or a
// descriptive string ("Programme not announced") when the source doesn't list
// it. Both get the same "Programme" label so it's always clear what this line
// represents; the two shapes are then styled differently — confirmed works
// read as a row of chips, a note reads (serif italic, muted) as prose.
function piecesHTML(pieces) {
  if (Array.isArray(pieces)) {
    const items = pieces.filter(p => typeof p === "string" && p.trim());
    if (items.length === 0) return "";
    const chips = items.map(p => `<span class="piece">${escapeHTML(p)}</span>`).join("");
    return `<div class="repertoire"><span class="repertoire-label">Programme</span><div class="repertoire-list">${chips}</div></div>`;
  }
  if (typeof pieces === "string" && pieces.trim()) {
    return `<div class="repertoire note"><span class="repertoire-label">Programme</span><span class="repertoire-text">${escapeHTML(pieces)}</span></div>`;
  }
  return "";
}

function piecesText(pieces) {
  if (Array.isArray(pieces)) return pieces.filter(p => typeof p === "string").join(" ");
  return typeof pieces === "string" ? pieces : "";
}

function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, s => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[s]));
}

function isSafeUrl(url) {
  if (typeof url !== "string") return false;
  try {
    const parsed = new URL(url, window.location.href);
    return parsed.protocol === "http:" || parsed.protocol === "https:";
  } catch {
    return false;
  }
}

async function fetchJSON(path) {
  const res = await fetch(path, { cache: "no-store" });
  if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
  return res.json();
}

async function init() {
  // The roster is supporting data: if it can't be loaded, the concert list
  // still renders and only the instrument filter drops out.
  const roster = fetchJSON("artists.json").catch(e => {
    console.error(e);
    return null;
  });
  try {
    const data = await fetchJSON("seen.json");
    allConcerts = data.concerts || [];
    const artists = await roster;
    loadRoster((artists && artists.artists) || []);
    populateFilters(allConcerts);
    render();
  } catch (e) {
    document.getElementById("main").innerHTML =
      '<div class="empty">Could not load seen.json.</div>';
    document.getElementById("subtitle").textContent = "Error";
    console.error(e);
  }
}

document.getElementById("artistFilter").addEventListener("change", render);
document.getElementById("instrumentFilter").addEventListener("change", render);
document.getElementById("countryFilter").addEventListener("change", render);
document.getElementById("searchBox").addEventListener("input", render);

init();
</script>
</body>
</html>
