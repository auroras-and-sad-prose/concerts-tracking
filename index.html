<!doctype html>
<html lang="en" data-theme="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upcoming Concerts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,400..700;1,400..600&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  /* Newspaper typographic split: a serif carries the "headline" elements —
     page title, month, artist name, day numeral — while a Franklin-style sans
     carries every piece of interface text. Both stacks fall back to widely
     installed faces so the page still reads correctly if the webfonts fail. */
  :root {
    color-scheme: light dark;
    --serif: "PT Serif", Georgia, "Times New Roman", serif;
    --sans: "Libre Franklin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

    --bg: #f5f7fa;
    --card-bg: #ffffff;
    --text: #151b26;
    --muted: #667085;
    --faint: #98a1b3;
    --border: #e4e8ef;
    --border-strong: #cfd6e2;
    --accent: #24548c;
    --accent-soft: #e8eff8;
    --on-accent: #ffffff;
    --chip-bg: #eef1f6;
    --alert: #a3282d;
    --alert-soft: #fbe9e9;
    /* Gold, and deliberately nothing like the accent blue: a favorite is a
       different kind of claim from a location or an instrument, and should be
       findable by colour alone while scrolling. */
    --fav: #8a5a10;
    --fav-soft: #fbf0d9;
    --shadow: 0 1px 2px rgba(21, 27, 38, .04);
    --shadow-hover: 0 8px 24px -16px rgba(21, 27, 38, .45);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --card-bg: #191d25;
      --text: #e9ecf2;
      --muted: #97a0b1;
      --faint: #6f7889;
      --border: #262c37;
      --border-strong: #39414f;
      --accent: #86b4e8;
      --accent-soft: #1c2a3c;
      --on-accent: #0f151d;
      --chip-bg: #212734;
      --alert: #f08a8f;
      --alert-soft: #3a1f22;
      --fav: #e5b45c;
      --fav-soft: #33280f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .35);
      --shadow-hover: 0 8px 24px -16px rgba(0, 0, 0, .85);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* ---------- Masthead ---------- */
  header { max-width: 860px; margin: 0 auto; padding: 3.5rem 1.5rem 1.25rem; }
  .eyebrow {
    font-size: .7rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
    color: var(--accent); margin-bottom: .85rem;
  }
  h1 {
    margin: 0;
    font-family: var(--serif); font-weight: 700;
    font-size: clamp(2rem, 5vw, 2.6rem);
    letter-spacing: -.012em; line-height: 1.06;
  }
  .subtitle { margin-top: .5rem; color: var(--muted); font-size: .92rem; }

  /* ---------- Filters ---------- */
  .controls-wrap {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .controls {
    max-width: 860px; margin: 0 auto;
    padding: .85rem 1.5rem;
    display: flex; flex-wrap: wrap; gap: .45rem;
  }
  .controls select, .controls input {
    background: var(--card-bg); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: 8px;
    padding: .45rem .75rem; font-size: .85rem; font-family: var(--sans);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .controls select {
    appearance: none; -webkit-appearance: none;
    padding-right: 1.9rem; cursor: pointer;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%23667085' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right .7rem center;
  }
  .controls select option { background: var(--card-bg); color: var(--text); }
  .controls select:hover, .controls input:hover { border-color: var(--faint); }
  .controls select:focus-visible, .controls input:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  /* Work titles are long enough to push everything else off the row, so this
     one control is capped and left to clip: the full title is readable in the
     open dropdown, which is where you pick from it anyway. */
  .controls select#favoriteFilter { max-width: min(100%, 15rem); }
  .controls input[type="search"] { flex: 1; min-width: 170px; }
  .controls input[type="search"]::placeholder { color: var(--faint); }

  /* ---------- Listing ---------- */
  main { max-width: 860px; margin: 0 auto; padding: .5rem 1.5rem 5rem; }
  .month-heading {
    margin: 2.4rem 0 .8rem;
    font-family: var(--serif); font-weight: 700;
    font-size: 1.12rem; letter-spacing: -.005em;
  }
  .group:first-child .month-heading { margin-top: 1.1rem; }

  .card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: .95rem 1.1rem;
    margin-bottom: .45rem;
    display: flex; gap: 1.1rem; align-items: flex-start;
    box-shadow: var(--shadow);
    transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .card:hover {
    border-color: var(--border-strong);
    box-shadow: var(--shadow-hover);
    transform: translateY(-1px);
  }

  .date-col {
    flex: 0 0 auto; width: 3.4rem; text-align: center;
    border: 1px solid var(--border); border-radius: 8px;
    padding: .35rem 0 .3rem;
    background: var(--chip-bg);
    font-variant-numeric: tabular-nums;
  }
  .date-col .mon { font-size: .6rem; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; color: var(--accent); }
  .date-col .day { font-family: var(--serif); font-weight: 700; font-size: 1.42rem; letter-spacing: -.01em; line-height: 1.12; }
  .date-col .dow { font-size: .6rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }

  .card .body { flex: 1; min-width: 0; }
  .card .topline { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .55rem; }
  .card .artist {
    font-family: var(--serif); font-weight: 700;
    font-size: 1.16rem; letter-spacing: -.003em;
  }
  .card .place { font-size: .86rem; color: var(--muted); margin-top: .2rem; }
  .card .place .city { color: var(--text); font-weight: 600; }
  .card .program { font-size: .82rem; color: var(--muted); margin-top: .4rem; line-height: 1.45; max-width: 62ch; }

  .card .repertoire { margin-top: .55rem; }
  .card .repertoire-label {
    display: block; font-size: .6rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .14em;
    color: var(--faint); margin-bottom: .32rem;
  }
  .card .repertoire-list { display: flex; flex-wrap: wrap; gap: .32rem; }
  .card .piece {
    font-size: .77rem; line-height: 1.35; font-weight: 500;
    padding: .18rem .55rem; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent);
  }
  /* A work on the curated favorites list. The chip that matched is marked
     rather than the whole programme, so a bill with one starred work among six
     says which one it is. */
  .card .piece.favorite {
    background: var(--fav-soft); color: var(--fav); font-weight: 600;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fav) 35%, transparent);
  }
  .card .piece.favorite::before { content: "★"; margin-right: .3rem; }

  /* Unlabelled, so it sits closer to the programme line it qualifies. */
  .card .repertoire.note { margin-top: .35rem; }
  .card .repertoire.note .repertoire-text {
    display: block; font-family: var(--serif); font-style: italic;
    font-size: .89rem; color: var(--muted);
  }

  /* A card carries up to two links: the concert's own page when the calendar
     linked to one, then the calendar it was found on. */
  .card .links {
    align-self: center; flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: flex-end; gap: .1rem;
  }
  .card a.link {
    font-size: .78rem; font-weight: 600; text-decoration: none;
    color: var(--accent); white-space: nowrap;
    border-radius: 6px; padding: .3rem .55rem;
    transition: background .15s ease;
  }
  .card a.link:hover { background: var(--accent-soft); }
  .card a.link.secondary { font-weight: 500; color: var(--muted); }
  .card a.link.secondary:hover { color: var(--accent); }

  /* ---------- Tags ---------- */
  .tag {
    display: inline-block;
    font-size: .65rem; font-weight: 600; letter-spacing: .03em;
    border-radius: 5px; padding: .13rem .45rem;
    background: var(--chip-bg); color: var(--muted);
  }
  .tag.loc-berlin { background: var(--accent); color: var(--on-accent); }
  .tag.loc-germany { background: var(--accent-soft); color: var(--accent); }
  .tag.loc-europe { background: var(--chip-bg); color: var(--faint); }
  .tag.instrument { background: transparent; color: var(--faint); box-shadow: inset 0 0 0 1px var(--border-strong); }
  /* card-bg, not white: the alert red flips light in dark mode, and the label
     has to stay legible on both. */
  .tag.status { background: var(--alert); color: var(--card-bg); text-transform: uppercase; letter-spacing: .06em; }
  .tag.favorite { background: var(--fav-soft); color: var(--fav); }

  /* Declared before .card.flagged so that, on a card which is both, the red
     edge wins: a concert that has been called off is news that outranks a
     programme you'd have liked. */
  .card.favorite { border-left: 3px solid var(--fav); }

  /* A concert that is off, moved, or handed to another soloist stays on the
     page — the row can never be deleted, and a reader who has tickets needs to
     see why. It is marked instead: a red edge, muted text, and the source's own
     words for what happened. */
  .card.flagged { border-left: 3px solid var(--alert); }
  .card.flagged .artist { text-decoration: line-through; text-decoration-color: var(--alert); }
  .card.flagged .repertoire, .card.flagged .program { color: var(--faint); }
  .card .status-line {
    margin-top: .45rem; padding: .35rem .55rem; border-radius: 6px;
    background: var(--alert-soft); color: var(--alert);
    font-size: .8rem; line-height: 1.45; max-width: 62ch;
  }

  .empty, .loading { color: var(--muted); padding: 4rem 0; text-align: center; font-size: .95rem; }
  footer { max-width: 860px; margin: 0 auto; padding: 0 1.5rem 3rem; color: var(--faint); font-size: .78rem; }

  @media (max-width: 560px) {
    header { padding-top: 2.5rem; }
    .card { padding: .9rem .95rem; gap: .85rem; flex-wrap: wrap; }
    .date-col { width: 3rem; }
    /* Too narrow to keep a column of links beside the text: they wrap onto
       their own row under the card instead. */
    .card .links {
      flex-direction: row; justify-content: flex-end;
      width: 100%; gap: .2rem; margin-top: .15rem;
    }
    .card a.link { padding: .25rem .4rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .card:hover { transform: none; }
  }

  /* =====================================================================
     Themes. "classic" is everything above and stays the default, dark mode
     included. The six below are light-only designs, picked from the theme
     control and remembered per browser. Each one is scoped to
     :root[data-theme="…"], and none of them changes what the page shows —
     only how it is laid out and set.
     ===================================================================== */

  /* Pieces of markup only some themes use: hidden until a theme asks. */
  .month-heading .num, .date-col .reach, .date-col .route, .group-heading .count { display: none; }
  #viz[hidden] { display: none; }

  /* Clicking a dot on the lanes timeline scrolls to its card and flashes it. */
  .card.highlight { outline: 3px solid var(--fav); outline-offset: 3px; }

  /* Light base shared by every non-classic theme, so the dark palette above
     never leaks into one. Each theme then overrides what it needs. */
  :root:is([data-theme="swiss"], [data-theme="poster"], [data-theme="calendar"], [data-theme="tickets"], [data-theme="lanes"], [data-theme="listings"]) {
    color-scheme: light;
    --bg: #f5f7fa; --card-bg: #ffffff; --text: #151b26; --muted: #667085; --faint: #98a1b3;
    --border: #e4e8ef; --border-strong: #cfd6e2; --accent: #24548c; --accent-soft: #e8eff8;
    --on-accent: #ffffff; --chip-bg: #eef1f6; --alert: #a3282d; --alert-soft: #fbe9e9;
    --fav: #8a5a10; --fav-soft: #fbf0d9;
    --shadow: 0 1px 2px rgba(21, 27, 38, .04); --shadow-hover: 0 8px 24px -16px rgba(21, 27, 38, .45);
  }
  :root:is([data-theme="swiss"], [data-theme="poster"], [data-theme="calendar"], [data-theme="tickets"], [data-theme="lanes"], [data-theme="listings"]) .card.favorite,
  :root:is([data-theme="swiss"], [data-theme="poster"], [data-theme="calendar"], [data-theme="tickets"], [data-theme="lanes"], [data-theme="listings"]) .card.flagged { border-left-width: 1px; }

  /* ---------- 1. Swiss timetable ---------- */
  :root[data-theme="swiss"] {
    --sans: "Archivo", "Helvetica Neue", Arial, sans-serif; --serif: var(--sans);
    --bg: #ffffff; --card-bg: #ffffff; --text: #111111; --muted: #5f5f5f; --faint: #8a8a8a;
    --border: #d9d9d9; --border-strong: #111111; --accent: #d6001c; --accent-soft: #fde8ea;
    --chip-bg: #f2f2f2; --fav: #d6001c; --fav-soft: #fde8ea; --alert: #d6001c; --alert-soft: #fde8ea;
    --shadow: none; --shadow-hover: none;
  }
  [data-theme="swiss"] header, [data-theme="swiss"] .controls, [data-theme="swiss"] main, [data-theme="swiss"] footer { max-width: 1180px; }
  [data-theme="swiss"] header { padding-top: 2rem; }
  [data-theme="swiss"] .eyebrow { color: var(--text); letter-spacing: .02em; text-transform: none; font-size: .85rem; border-top: 6px solid var(--text); padding-top: .7rem; }
  [data-theme="swiss"] h1 { font-size: clamp(3.4rem, 11vw, 8.6rem); font-weight: 800; letter-spacing: -.055em; line-height: .86; }
  [data-theme="swiss"] h1::after { content: "."; color: var(--accent); }
  [data-theme="swiss"] .subtitle { color: var(--text); font-weight: 700; font-size: 1rem; margin-top: 1rem; }
  [data-theme="swiss"] .controls-wrap { background: #ffffff; backdrop-filter: none; -webkit-backdrop-filter: none; border-top: 2px solid var(--text); border-bottom: 2px solid var(--text); }
  [data-theme="swiss"] .controls select, [data-theme="swiss"] .controls input { border-radius: 0; border-color: var(--text); }
  [data-theme="swiss"] .group { display: grid; grid-template-columns: 150px minmax(0, 1fr); column-gap: 1.5rem; border-top: 2px solid var(--text); padding-top: .6rem; margin-top: 1.6rem; }
  [data-theme="swiss"] .month-heading, [data-theme="swiss"] .group:first-child .month-heading { margin: 0; display: flex; flex-direction: column; font-size: .8rem; }
  [data-theme="swiss"] .month-heading .num { display: block; font-size: 4.6rem; font-weight: 800; line-height: .9; letter-spacing: -.04em; color: var(--accent); font-variant-numeric: tabular-nums; }
  [data-theme="swiss"] .card {
    display: grid; grid-template-columns: 5.2rem 11rem 13rem minmax(0, 1fr) auto; column-gap: 1.25rem; align-items: start;
    border: 0; border-bottom: 1px solid var(--border); border-radius: 0; padding: .8rem 0 .9rem; margin: 0;
  }
  [data-theme="swiss"] .card:hover { transform: none; background: #fafafa; }
  [data-theme="swiss"] .date-col { grid-row: 1 / span 3; width: auto; border: 0; background: none; padding: 0; text-align: left; display: flex; gap: .35rem; align-items: baseline; }
  [data-theme="swiss"] .date-col .mon { display: none; }
  [data-theme="swiss"] .date-col .day { font-size: 1.6rem; font-weight: 800; }
  [data-theme="swiss"] .date-col .dow { color: var(--muted); font-size: .85rem; text-transform: none; letter-spacing: 0; }
  [data-theme="swiss"] .card .body { display: contents; }
  [data-theme="swiss"] .card .topline { grid-column: 2; grid-row: 1 / span 3; flex-direction: column; align-items: flex-start; }
  [data-theme="swiss"] .card .artist { font-size: 1rem; font-weight: 700; }
  [data-theme="swiss"] .card .place { grid-column: 3; grid-row: 1 / span 3; margin: 0; }
  [data-theme="swiss"] .card .place .city { display: block; font-weight: 700; }
  [data-theme="swiss"] .card .place .city + .sep { display: none; }
  [data-theme="swiss"] .card .program, [data-theme="swiss"] .card .repertoire, [data-theme="swiss"] .card .status-line { grid-column: 4; margin-top: 0; }
  [data-theme="swiss"] .card .repertoire { margin-top: .3rem; }
  [data-theme="swiss"] .card .repertoire-label { display: none; }
  [data-theme="swiss"] .card .repertoire-list { display: block; }
  [data-theme="swiss"] .card .piece { display: block; background: none; color: var(--text); padding: 0; border-radius: 0; font-size: .92rem; font-weight: 400; }
  [data-theme="swiss"] .card .piece.favorite { background: none; box-shadow: none; color: var(--accent); font-weight: 700; }
  [data-theme="swiss"] .card .repertoire.note .repertoire-text { font-family: var(--sans); font-style: normal; color: var(--faint); }
  [data-theme="swiss"] .card .links { grid-column: 5; grid-row: 1 / span 3; align-self: start; }
  [data-theme="swiss"] .card a.link { color: var(--text); border-radius: 0; padding: 0 0 1px; border-bottom: 2px solid currentColor; margin-bottom: .45rem; }
  [data-theme="swiss"] .card a.link:hover { background: none; color: var(--accent); }
  [data-theme="swiss"] .tag { border-radius: 0; }
  [data-theme="swiss"] .tag.loc-berlin { background: var(--accent); color: #ffffff; }
  [data-theme="swiss"] .tag.loc-germany { background: var(--text); color: #ffffff; }
  [data-theme="swiss"] .tag.loc-europe { background: none; color: var(--muted); box-shadow: inset 0 0 0 1px var(--border); }
  [data-theme="swiss"] .tag.favorite { background: none; color: var(--accent); padding-left: 0; }
  [data-theme="swiss"] .card.flagged { border-left: 0; }
  [data-theme="swiss"] .card.flagged:hover { background: #fafafa; }
  @media (max-width: 760px) {
    [data-theme="swiss"] .group { grid-template-columns: minmax(0, 1fr); }
    [data-theme="swiss"] .month-heading { flex-direction: row; align-items: baseline; gap: .6rem; }
    [data-theme="swiss"] .month-heading .num { font-size: 2.6rem; }
    [data-theme="swiss"] .card { grid-template-columns: 4.2rem minmax(0, 1fr); flex-wrap: nowrap; }
    [data-theme="swiss"] .date-col { grid-row: 1 / span 6; flex-direction: column; gap: 0; }
    [data-theme="swiss"] .card .topline, [data-theme="swiss"] .card .place, [data-theme="swiss"] .card .program,
    [data-theme="swiss"] .card .repertoire, [data-theme="swiss"] .card .status-line, [data-theme="swiss"] .card .links { grid-column: 2; grid-row: auto; }
    [data-theme="swiss"] .card .links { flex-direction: row; justify-content: flex-start; gap: 1rem; margin-top: .4rem; }
  }

  /* ---------- 2. Season poster ---------- */
  :root[data-theme="poster"] {
    --serif: "Bodoni Moda", Didot, "Bodoni 72", Georgia, serif; --sans: "Jost", Futura, "Century Gothic", sans-serif;
    --bg: #fbf8f3; --card-bg: #ffffff; --text: #151515; --muted: #4f4a44; --faint: #6f6962;
    --border: #e6dfd4; --border-strong: #151515; --accent: #151515; --accent-soft: #ece6dc;
    --chip-bg: #ece6dc; --fav: #151515; --fav-soft: #151515; --alert: #b3261e; --alert-soft: #fbe3e0;
  }
  [data-theme="poster"] header, [data-theme="poster"] .controls, [data-theme="poster"] main, [data-theme="poster"] footer { max-width: 1180px; }
  [data-theme="poster"] .eyebrow { color: var(--text); letter-spacing: .3em; font-weight: 500; }
  [data-theme="poster"] h1 { font-size: clamp(3.4rem, 10vw, 8.2rem); font-weight: 500; font-style: italic; line-height: .9; letter-spacing: -.03em; }
  [data-theme="poster"] .subtitle { font-size: 1.05rem; color: var(--muted); margin-top: 1.4rem; }
  [data-theme="poster"] .controls select, [data-theme="poster"] .controls input { border-radius: 999px; border-color: var(--border); background-color: transparent; }
  [data-theme="poster"] .month-heading, [data-theme="poster"] .group:first-child .month-heading { font-style: italic; font-weight: 500; font-size: 2.4rem; margin: 2.8rem 0 1rem; }
  [data-theme="poster"] .group-body { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 1.4rem; }
  [data-theme="poster"] .card {
    flex-direction: column; gap: .9rem; margin: 0; min-height: 26rem;
    background: var(--artist-soft); border: 0; border-radius: 4px; padding: 1.8rem 1.7rem 1.5rem; box-shadow: none;
  }
  [data-theme="poster"] .card:hover { box-shadow: 0 18px 40px -28px rgba(0, 0, 0, .55); }
  [data-theme="poster"] .date-col { width: auto; border: 0; background: none; padding: 0; text-align: left; display: flex; align-items: baseline; gap: .6rem; }
  [data-theme="poster"] .date-col .day { order: -1; font-size: 5rem; font-weight: 500; line-height: .8; }

<body>
<header>
  <div class="eyebrow">Concert Watch</div>
  <h1>Upcoming Concerts</h1>
  <div class="subtitle" id="subtitle">Loading…</div>
</header>

<div class="controls-wrap">
  <div class="controls">
    <select id="artistFilter" aria-label="Filter by artist"><option value="">All artists</option></select>
    <select id="instrumentFilter" hidden aria-label="Filter by instrument"><option value="">All instruments</option></select>
    <select id="favoriteFilter" hidden aria-label="Filter by favorite work"><option value="">All programmes</option></select>
    <select id="countryFilter" aria-label="Filter by country"><option value="">All countries</option></select>
    <input type="search" id="searchBox" placeholder="Search city, venue, programme…" aria-label="Search concerts">
    <select id="themePicker" aria-label="Page theme"></select>
  </div>
</div>

<section id="viz" hidden></section>

<main id="main">
  <div class="loading">Loading concerts…</div>
</main>

<footer>Curated from the artists’ own calendars and Bachtrack.</footer>

<script>
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTH = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let allConcerts = [];

// Which instruments each artist plays, from artists.json. That roster is
// curated and static — an instrument is a fact about the performer, not about
// one concert — so it lives outside seen.json and is joined in here by artist
// name, which CI guarantees matches the roster exactly.
let instrumentsByName = new Map();

function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function loadRoster(artists) {
  instrumentsByName = new Map();
  for (const a of artists) {
    if (a.name && Array.isArray(a.instruments)) {
      instrumentsByName.set(a.name, a.instruments.filter(i => typeof i === "string" && i.trim()));
    }
  }
}

// Every instrument the artist plays, from the roster.
function rosterInstrumentsOf(concert) {
  return instrumentsByName.get(concert.artist) || [];
}

// What this row itself says the engagement calls for — often nothing, since
// most listings don't mention it.
function statedInstrumentsOf(concert) {
  return Array.isArray(concert.instruments)
    ? concert.instruments.filter(i => typeof i === "string" && i.trim())
    : [];
}

// The instruments a concert counts as. A row that names its own narrows the
// roster to those; one that doesn't matches every instrument its artist plays,
// so an unstated Fischer date shows under both Piano and Violin rather than
// disappearing from the filter or pretending to know which it was.
function instrumentsOf(concert) {
  const stated = statedInstrumentsOf(concert);
  return stated.length ? stated : rosterInstrumentsOf(concert);
}

// Shown only for artists who play more than one instrument — that is where the
// row-level detail answers a real question. For a pianist it would just repeat
// what the name already tells you.
function instrumentTagsHTML(concert) {
  if (rosterInstrumentsOf(concert).length < 2) return "";
  return statedInstrumentsOf(concert)
    .map(i => `<span class="tag instrument">${escapeHTML(i)}</span>`)
    .join("");
}

// ---------- Favorite works ----------
//
// favorites.json is the curated list of works worth travelling for. Whether a
// concert plays one is derived here rather than stored on the row: it is a
// function of the row's pieces and the list, so computing it means starring a
// new work lights up every concert already in the dataset, and means seen.json
// carries no field that could disagree with either input.
//
// Everything from here to favoriteHitsIn() is a mirror of the Go matcher in
// tools/favorites, which the concert-watch routine uses to decide what to
// alert on. The two must agree, or the page would highlight concerts the alert
// never mentioned. tools/favorites/testdata/cases.json is the shared fixture
// that holds them to it, checked from this side by tests/smoke.test.mjs.
//
// Any edit below is an edit to favorites.go as well.

// Lowercase accented Latin letters and the plain letters they fold to. Applied
// as an explicit table rather than via String.normalize("NFD") because the Go
// side applies this same table: two tables equal by construction cannot drift,
// where decomposition would differ on every letter that has none — ø, ł, ß, æ.
const FOLD_FROM =
  "àáâãäåāăą" + "çćĉċč" + "ďđ" + "èéêëēĕėęě" + "ĝğġģ" + "ĥħ" +
  "ìíîïĩīĭįı" + "ĵ" + "ķ" + "ĺļľŀł" + "ñńņň" + "òóôõöōŏőø" + "ŕŗř" +
  "śŝşš" + "ţťŧ" + "ùúûüũūŭůűų" + "ŵ" + "ýÿŷ" + "źżž";
const FOLD_TO =
  "aaaaaaaaa" + "ccccc" + "dd" + "eeeeeeeee" + "gggg" + "hh" +
  "iiiiiiiii" + "j" + "k" + "lllll" + "nnnn" + "ooooooooo" + "rrr" +
  "ssss" + "ttt" + "uuuuuuuuuu" + "w" + "yyy" + "zzz";
const FOLD_EXPAND = { "ß": "ss", "æ": "ae", "œ": "oe", "ĳ": "ij", "þ": "th", "ð": "d" };
const FOLD_SINGLE = buildFoldTable();

// The table is paired by index, so "equal by construction" holds only while the
// two strings are the same length. The Go side panics when they aren't; a page
// that renders concerts should not blank itself over it, so this says so
// loudly instead and folds the pairs it does have. A console error fails the
// smoke tests, which is what catches a one-sided edit before it ships — and the
// fixture those tests read pins every pair individually, so a letter added to
// the wrong half is caught even where the lengths still agree.
function buildFoldTable() {
  const from = [...FOLD_FROM];
  const to = [...FOLD_TO];
  if (from.length !== to.length) {
    console.error(
      `favorites: fold table has ${from.length} source letters but ${to.length} targets; ` +
      "accented titles will stop matching until the two strings in index.html line up again");
  }
  const pairs = Math.min(from.length, to.length);
  return new Map(from.slice(0, pairs).map((ch, i) => [ch, to[i]]));
}

// Reduces a work title to the form patterns are compared in: lowercase,
// unaccented, punctuation turned into token boundaries.
//
//   `Max Bruch: Violinkonzert Nr. 1 g-Moll op. 26`
//   → "max bruch violinkonzert nr 1 g moll op 26"
//
// Punctuation becomes a space rather than vanishing, so "g-Moll" stays two
// tokens and can never be matched as "gmoll".
function normalizeTitle(s) {
  let out = "";
  let space = true; // leading spaces are never emitted
  for (const ch of String(s).toLowerCase()) {
    const code = ch.codePointAt(0);
    // A combining mark: dropped, so an already-decomposed title ("a" + U+0301)
    // folds the same way a precomposed "á" does. This also disposes of the
    // combining dot that lowercasing Turkish "İ" leaves behind.
    if (code >= 0x300 && code <= 0x36f) continue;
    if ((ch >= "a" && ch <= "z") || (ch >= "0" && ch <= "9")) { out += ch; space = false; continue; }
    const folded = FOLD_SINGLE.get(ch);
    if (folded !== undefined) { out += folded; space = false; continue; }
    const expanded = FOLD_EXPAND[ch];
    if (expanded !== undefined) { out += expanded; space = false; continue; }
    if (!space) { out += " "; space = true; }
  }
  return out.replace(/ $/, "");
}

// The curated list, with every pattern term pre-normalized.
let favorites = [];

// A pattern holding a term with nothing to match on is dropped whole rather
// than shortened: dropping just the term would silently widen the pattern —
// ["chopin", "—"] would become "anything by Chopin". CI rejects such a file
// outright; this is what the page does if one reaches it anyway.
function parseFavorites(list) {
  const out = [];
  for (const fav of Array.isArray(list) ? list : []) {
    if (!fav || typeof fav.slug !== "string" || typeof fav.title !== "string") continue;
    const patterns = (Array.isArray(fav.patterns) ? fav.patterns : [])
      .filter(p => Array.isArray(p) && p.length > 0)
      .map(p => p.map(term => normalizeTitle(term)))
      .filter(p => p.every(term => term.length > 0));
    if (patterns.length === 0) continue;
    out.push({ slug: fav.slug, title: fav.title, patterns });
  }
  return out;
}

// Every favorite found in a row's pieces, as {pieceIndex, slug, title}.
//
// Only the array form is matched. The string form — "Programme not announced",
// "Composers only: Chopin" — says the works are unknown, and reading a
// favorite out of it would turn "we don't know" into "your piece is on the
// bill". A term matches only on whole tokens, so "op 2" misses "Op. 23".
function favoriteHitsIn(pieces, favs) {
  const hits = [];
  if (!Array.isArray(pieces)) return hits;
  pieces.forEach((piece, pieceIndex) => {
    if (typeof piece !== "string") return;
    const normalized = normalizeTitle(piece);
    if (!normalized) return;
    const padded = " " + normalized + " ";
    for (const fav of favs) {
      if (fav.patterns.some(p => p.every(term => padded.includes(" " + term + " ")))) {
        hits.push({ pieceIndex, slug: fav.slug, title: fav.title });
      }
    }
  });
  return hits;
}

// Concert row -> its hits, computed once when the data loads rather than on
// every keystroke in the search box.
let favoriteHits = new Map();

function hitsOf(concert) {
  return favoriteHits.get(concert) || [];
}

function indexFavorites(concerts) {
  favoriteHits = new Map(concerts.map(c => [c, favoriteHitsIn(c.pieces, favorites)]));
}

function favoriteTagHTML(concert) {
  const count = new Set(hitsOf(concert).map(h => h.slug)).size;
  if (count === 0) return "";
  const label = count === 1 ? "Favorite" : `${count} favorites`;
  return `<span class="tag favorite">★ ${escapeHTML(label)}</span>`;
}

function titleCase(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function addOptions(selectId, values, label = v => v) {
  const sel = document.getElementById(selectId);
  for (const v of [...new Set(values)].sort()) {
    const opt = document.createElement("option");
    opt.value = v; opt.textContent = label(v);
    sel.appendChild(opt);
  }
  return sel;
}

function populateFilters(concerts) {
  addOptions("artistFilter", concerts.map(c => c.artist));
  // Stays hidden when the roster is unavailable or tells us nothing, so the
  // page still works with only seen.json rather than showing a dead control.
  const instrumentSel = addOptions("instrumentFilter", concerts.flatMap(instrumentsOf), titleCase);
  instrumentSel.hidden = instrumentSel.options.length <= 1;
  addOptions("countryFilter", concerts.map(c => c.country).filter(Boolean));
}

// Left in the curated file's order rather than sorted: the list is short and
// hand-arranged, and "Any favorite" leads either way. Like the instrument
// control it stays hidden when there is nothing behind it, so a missing or
// empty favorites.json costs the page nothing.
function populateFavoriteFilter() {
  const sel = document.getElementById("favoriteFilter");
  if (favorites.length === 0) return;
  const any = document.createElement("option");
  any.value = "*";
  any.textContent = "★ Any favorite";
  sel.appendChild(any);
  for (const fav of favorites) {
    const opt = document.createElement("option");
    opt.value = fav.slug;
    opt.textContent = fav.title;
    sel.appendChild(opt);
  }
  sel.hidden = false;
}

// `status` says a listed concert is no longer the concert this row describes —
// called off, moved, or handed to another soloist — and `status_note` carries
// the source's own words for it. Both are null on a concert that is simply on.
function statusLabel(status) {
  return titleCase(String(status).replace(/_/g, " "));
}

function statusTagHTML(concert) {
  if (!concert.status) return "";
  return `<span class="tag status">${escapeHTML(statusLabel(concert.status))}</span>`;
}

function statusLineHTML(concert) {
  if (!concert.status) return "";
  const note = typeof concert.status_note === "string" ? concert.status_note.trim() : "";
  return `<div class="status-line">${escapeHTML(note || statusLabel(concert.status))}</div>`;
}

// The location tag doubles as a colour class so Berlin and Germany dates stand
// out from the rest of Europe at a glance; the class list is closed by CI's
// location_tag allowlist.
function locationTagHTML(tag) {
  if (!tag) return "";
  const cls = tag === "berlin" ? "loc-berlin" : tag === "germany" ? "loc-germany" : "loc-europe";
  return `<span class="tag ${cls}">${escapeHTML(tag)}</span>`;
}

// ---------- Themes ----------
//
// Seven looks for the same data. "classic" is the page as it always was and
// stays the default; the others are light-only designs that restyle the same
// markup through :root[data-theme="…"] rules, and two of them add an overview
// above the list (a year calendar, a timeline per artist). None of them
// changes what is shown: same rows, same filters, same favorite matching.
// The choice is remembered per browser and can be linked with ?theme=<id>.
const THEMES = [
  { id: "classic", label: "Classic" },
  { id: "swiss", label: "Swiss timetable", fonts: "family=Archivo:wght@400;700;800" },
  { id: "poster", label: "Season poster", fonts: "family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@400;500;600" },
  { id: "calendar", label: "Year at a glance", fonts: "family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;600", view: "calendar" },
  { id: "tickets", label: "Ticket stubs", fonts: "family=IBM+Plex+Mono:wght@400;700&family=Oswald:wght@500;600" },
  { id: "lanes", label: "Artist lanes", fonts: "family=Sora:wght@400;600", view: "lanes" },
  { id: "listings", label: "Magazine listings", fonts: "family=Libre+Franklin:wght@400;600&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600", groupBy: "place" },
];
const THEME_KEY = "concert-watch-theme";
let theme = THEMES[0];

function themeById(id) {
  return THEMES.find(t => t.id === id) || null;
}

// Storage can be missing or throw (private windows, blocked site data); the
// page then simply starts on the default every time.
function savedThemeId() {
  try {
    const fromURL = new URLSearchParams(window.location.search).get("theme");
    if (fromURL && themeById(fromURL)) return fromURL;
    return window.localStorage.getItem(THEME_KEY);
  } catch {
    return null;
  }
}

// Each theme's webfonts are fetched the first time it is picked, so the
// default page loads exactly what it always did.
const loadedFonts = new Set();
function loadThemeFonts(t) {
  if (!t.fonts || loadedFonts.has(t.id)) return;
  loadedFonts.add(t.id);
  const link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = `https://fonts.googleapis.com/css2?${t.fonts}&display=swap`;
  document.head.appendChild(link);
}

function applyTheme(id, { save = false } = {}) {
  theme = themeById(id) || THEMES[0];
  document.documentElement.dataset.theme = theme.id;
  document.getElementById("themePicker").value = theme.id;
  loadThemeFonts(theme);
  calendarSelection = null;
  if (save) {
    try { window.localStorage.setItem(THEME_KEY, theme.id); } catch { /* not remembered, still applied */ }
  }
}

function populateThemePicker() {
  const sel = document.getElementById("themePicker");
  for (const t of THEMES) {
    const opt = document.createElement("option");
    opt.value = t.id;
    opt.textContent = `Theme: ${t.label}`;
    sel.appendChild(opt);
  }
}

// One colour per artist, in roster order, for the themes that tell artists
// apart by colour (poster backgrounds, calendar and timeline dots). The strong
// shades also differ in lightness, not just hue.
const ARTIST_STRONG = ["#7e22ce", "#0f766e", "#a16207", "#be185d", "#1d4ed8", "#c2410c", "#334155"];
const ARTIST_SOFT = ["#cbe2c4", "#f1da8e", "#e2cdeb", "#f7c6d9", "#f5c7b4", "#c7d7ef", "#d5dce4"];
let artistOrder = [];

function artistIndex(name) {
  let i = artistOrder.indexOf(name);
  if (i === -1) { artistOrder.push(name); i = artistOrder.length - 1; }
  return i;
}

function artistStyle(name) {
  const i = artistIndex(name);
  return `--artist:${ARTIST_STRONG[i % ARTIST_STRONG.length]};--artist-soft:${ARTIST_SOFT[i % ARTIST_SOFT.length]}`;
}

// The ticket stub's reach label, from the same closed location_tag vocabulary.
const REACH = { berlin: "In town", germany: "Deutschlandticket", europe: "Abroad" };

// ---------- Year-at-a-glance calendar ----------

// {from, to} ISO dates the list is narrowed to, or null. Only the calendar
// theme sets it, and switching theme clears it.
let calendarSelection = null;

function isoOf(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function upcomingSpan(today) {
  const dates = allConcerts.map(c => c.date).filter(d => d >= today).sort();
  const first = new Date(today + "T00:00:00");
  const last = new Date((dates[dates.length - 1] || today) + "T00:00:00");
  return { first, last };
}

function renderCalendar(list, today) {
  const byDate = new Map();
  for (const c of list) {
    if (!byDate.has(c.date)) byDate.set(c.date, []);
    byDate.get(c.date).push(c);
  }
  const { first, last } = upcomingSpan(today);
  const sel = calendarSelection;
  let months = "";
  for (let m = new Date(first.getFullYear(), first.getMonth(), 1); m <= last; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) {
    const next = new Date(m.getFullYear(), m.getMonth() + 1, 1);
    let cells = ["M","T","W","T","F","S","S"].map(w => `<span class="wd">${w}</span>`).join("");
    cells += '<span></span>'.repeat((m.getDay() + 6) % 7);
    let count = 0;
    for (let d = new Date(m); d < next; d.setDate(d.getDate() + 1)) {
      const iso = isoOf(d);
      const rows = byDate.get(iso) || [];
      count += rows.length;
      const cls = ["cal-day",
        iso < today ? "past" : "",
        sel && iso >= sel.from && iso <= sel.to ? "sel" : "",
        rows.some(c => c.location_tag === "berlin") ? "berlin" : ""].filter(Boolean).join(" ");
      if (!rows.length) { cells += `<span class="${cls}">${d.getDate()}</span>`; continue; }
      const dots = rows.slice(0, 3).map(c => `<i style="${artistStyle(c.artist)}"></i>`).join("");
      const star = rows.some(c => hitsOf(c).length) ? '<span class="star">★</span>' : "";
      const label = `${d.getDate()} ${MONTH[d.getMonth()]}: ` + rows.map(c => `${c.artist} in ${c.city}`).join("; ");
      cells += `<button type="button" class="${cls}" data-day="${iso}" title="${escapeHTML(label)}" aria-label="${escapeHTML(label)}">${d.getDate()}<span class="dots">${dots}</span>${star}</button>`;
    }
    months += `<div class="cal-month"><div class="cal-month-head">${MONTH[m.getMonth()]} ${m.getFullYear()}<small>${count}</small></div><div class="cal-grid">${cells}</div></div>`;
  }
  const artists = [...new Set(list.map(c => c.artist))].sort((a, b) => artistIndex(a) - artistIndex(b));
  const legend = artists.map(a => `<span><i class="swatch" style="${artistStyle(a)}"></i>${escapeHTML(a)}</span>`).join("");
  const selection = sel
    ? `<div class="cal-selection"><strong>${escapeHTML(rangeLabel(sel))}</strong><button type="button" data-cal-clear>Show all dates</button></div>`
    : `<div class="cal-selection">Pick a day to list only that day; shift-click another to take in the days between.</div>`;
  return `<div class="cal-top"><div class="cal-legend">${legend}</div>` +
    `<div class="cal-key"><span><i class="swatch" style="background:none;box-shadow:inset 0 0 0 2px #111;border-radius:3px"></i>Berlin</span><span><span style="color:var(--fav)">★</span>plays a favorite</span></div></div>` +
    `<div class="cal-months">${months}</div>${selection}`;
}

function rangeLabel(sel) {
  const f = new Date(sel.from + "T00:00:00"), t = new Date(sel.to + "T00:00:00");
  const one = d => `${DOW[d.getDay()]} ${d.getDate()} ${MONTH[d.getMonth()]}`;
  return sel.from === sel.to ? one(f) : `${one(f)} – ${one(t)}`;
}

function onCalendarClick(e) {
  if (e.target.closest("[data-cal-clear]")) { calendarSelection = null; render(); return; }
  const day = e.target.closest("[data-day]");
  if (!day) return;
  const iso = day.dataset.day;
  const sel = calendarSelection;
  if (e.shiftKey && sel) {
    calendarSelection = { from: iso < sel.from ? iso : sel.from, to: iso > sel.to ? iso : sel.to };
  } else if (sel && sel.from === iso && sel.to === iso) {
    calendarSelection = null;
  } else {
    calendarSelection = { from: iso, to: iso };
  }
  render();
}

// ---------- Artist lanes timeline ----------

function renderLanes(list, today) {
  const { last } = upcomingSpan(today);
  const start = new Date(new Date(today + "T00:00:00").getFullYear(), new Date(today + "T00:00:00").getMonth(), 1);
  const end = new Date(last.getFullYear(), last.getMonth() + 1, 1);
  const span = end - start;
  const pct = iso => ((new Date(iso + "T00:00:00") - start) / span * 100).toFixed(3) + "%";
  let ticks = "", grid = "";
  for (let m = new Date(start); m < end; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) {
    const x = pct(isoOf(m));
    const label = MONTH_ABBR[m.getMonth()] + (m.getMonth() === 0 || +m === +start ? " ’" + String(m.getFullYear()).slice(2) : "");
    ticks += `<span class="tick" style="left:${x}">${label}</span>`;
    grid += `<i class="gl" style="left:${x}"></i>`;
  }
  const names = [...artistOrder];
  for (const c of list) if (!names.includes(c.artist)) names.push(c.artist);
  let lanes = "";
  for (const name of names) {
    const rows = list.filter(c => c.artist === name);
    const total = allConcerts.filter(c => c.artist === name && c.date >= today).length;
    const note = total === 0 ? "no upcoming dates" : rows.length === total ? `${total} date${total === 1 ? "" : "s"}` : `${rows.length} of ${total} shown`;
    const dots = rows.map(c => {
      const d = new Date(c.date + "T00:00:00");
      const label = `${c.artist} — ${DOW[d.getDay()]} ${d.getDate()} ${MONTH_ABBR[d.getMonth()]} ${d.getFullYear()} — ${c.city}` + (c.status ? ` (${statusLabel(c.status)})` : "");
      const cls = ["lane-dot", c.location_tag === "berlin" ? "berlin" : "", hitsOf(c).length ? "fav" : "", c.status ? "flagged" : ""].filter(Boolean).join(" ");
      return `<button type="button" class="${cls}" style="left:${pct(c.date)};${artistStyle(name)}" data-goto="${escapeHTML(c.id)}" title="${escapeHTML(label)}" aria-label="${escapeHTML(label)}"></button>`;
    }).join("");
    const berlinLabels = [...new Set(rows.filter(c => c.location_tag === "berlin").map(c => c.date.slice(0, 7)))]
      .map(ym => rows.find(c => c.location_tag === "berlin" && c.date.startsWith(ym)))
      .map(c => `<span class="lane-label" style="left:${pct(c.date)}">Berlin</span>`).join("");
    lanes += `<div class="lane-name"><b>${escapeHTML(name)}</b><small>${note}</small></div>` +
      `<div class="lane-track${rows.length ? "" : " no-dates"}">${grid}<span class="lane-today" style="left:${pct(today)}"></span>${berlinLabels}${dots}</div>`;
  }
  return `<div class="lanes-key"><span><i class="swatch" style="background:#999;width:.7rem;height:.7rem;box-shadow:0 0 0 2px #111"></i>Berlin</span>` +
    `<span><i class="swatch" style="background:#999;box-shadow:0 0 0 3px #f6e0a8"></i>plays a favorite</span>` +
    `<span><i style="display:inline-block;width:2px;height:.9rem;background:var(--lane-today)"></i>today</span></div>` +
    `<div class="lanes"><div class="axis">${ticks}</div>${lanes}</div>` +
    `<div class="lanes-note">Each dot is one concert. Click it to jump to its card.</div>`;
}

function onLanesClick(e) {
  const dot = e.target.closest("[data-goto]");
  if (!dot) return;
  const card = [...document.querySelectorAll(".card")].find(el => el.dataset.id === dot.dataset.goto);
  if (!card) return;
  card.scrollIntoView({ behavior: "smooth", block: "center" });
  card.classList.add("highlight");
  setTimeout(() => card.classList.remove("highlight"), 1800);
}

function onVizClick(e) {
  if (theme.view === "calendar") onCalendarClick(e);
  else if (theme.view === "lanes") onLanesClick(e);
}

// ---------- Grouping ----------

// By month for every theme but the listings, which group by how far away the
// concert is — the order a reader in Berlin decides in.
const PLACE_GROUPS = [
  { tag: "berlin", title: "In Berlin" },
  { tag: "germany", title: "Around Germany" },
  { tag: "europe", title: "Elsewhere in Europe" },
];

function groupsOf(list) {
  if (theme.groupBy === "place") {
    return PLACE_GROUPS
      .map(g => ({ heading: `<h2 class="group-heading place-heading">${g.title}<span class="count">${countLabel(list.filter(c => c.location_tag === g.tag).length)}</span></h2>`, rows: list.filter(c => c.location_tag === g.tag) }))
      .concat([{ heading: '<h2 class="group-heading place-heading">Elsewhere</h2>', rows: list.filter(c => !PLACE_GROUPS.some(g => g.tag === c.location_tag)) }])
      .filter(g => g.rows.length);
  }
  const groups = [];
  for (const c of list) {
    const d = new Date(c.date + "T00:00:00");
    const key = `${MONTH[d.getMonth()]} ${d.getFullYear()}`;
    if (!groups.length || groups[groups.length - 1].key !== key) {
      groups.push({ key, rows: [], heading: `<h2 class="group-heading month-heading"><span class="num">${String(d.getMonth() + 1).padStart(2, "0")}</span><span class="name">${key}</span></h2>` });
    }
    groups[groups.length - 1].rows.push(c);
  }
  return groups;
}

function countLabel(n) {
  return `${n} concert${n === 1 ? "" : "s"}`;
}

function render() {
  const artist = document.getElementById("artistFilter").value;
  const instrument = document.getElementById("instrumentFilter").value;
  const favorite = document.getElementById("favoriteFilter").value;
  const country = document.getElementById("countryFilter").value;
  const search = document.getElementById("searchBox").value.trim().toLowerCase();
  const today = todayISO();

  let list = allConcerts.filter(c => c.date >= today);
  if (artist) list = list.filter(c => c.artist === artist);
  if (instrument) list = list.filter(c => instrumentsOf(c).includes(instrument));
  // "*" is every favorite at once — the question the list is usually asked.
  if (favorite === "*") list = list.filter(c => hitsOf(c).length > 0);
  else if (favorite) list = list.filter(c => hitsOf(c).some(h => h.slug === favorite));
  if (country) list = list.filter(c => c.country === country);
  if (search) {
    list = list.filter(c =>
      (c.city || "").toLowerCase().includes(search) ||
      (c.venue || "").toLowerCase().includes(search) ||
      (c.program || "").toLowerCase().includes(search) ||
      piecesText(c.pieces).toLowerCase().includes(search) ||
      (c.artist || "").toLowerCase().includes(search) ||
      (c.status_note || "").toLowerCase().includes(search)
    );
  }
  list.sort((a, b) => a.date.localeCompare(b.date));

  // The overview draws every concert the filters let through; a day picked on
  // the calendar then narrows the list under it.
  const viz = document.getElementById("viz");
  if (theme.view === "calendar") viz.innerHTML = renderCalendar(list, today);
  else if (theme.view === "lanes") viz.innerHTML = renderLanes(list, today);
  else viz.innerHTML = "";
  viz.hidden = !theme.view;
  if (theme.view === "calendar" && calendarSelection) {
    const { from, to } = calendarSelection;
    list = list.filter(c => c.date >= from && c.date <= to);
  }

  const main = document.getElementById("main");
  const withFavorite = list.filter(c => hitsOf(c).length > 0).length;
  document.getElementById("subtitle").textContent =
    `${list.length} upcoming concert${list.length === 1 ? "" : "s"}` +
    (withFavorite ? ` · ${withFavorite} with a favorite` : "");

  if (list.length === 0) {
    main.innerHTML = '<div class="empty">No upcoming concerts match your filters.</div>';
    return;
  }

  const card = theme.groupBy === "place" ? listingHTML : cardHTML;
  main.innerHTML = groupsOf(list)
    .map(g => `<section class="group">${g.heading}<div class="group-body">${g.rows.map(card).join("")}</div></section>`)
    .join("");
}

// The concert's own page leads: a reader deciding whether to go wants the
// hall's page, not the calendar it was spotted on. The calendar stays
// reachable as the row's provenance.
function linksOf(c) {
  const safeUrl = isSafeUrl(c.source_url) ? c.source_url : null;
  // The detail page is where a programme missing from the calendar came
  // from, so it is worth offering alongside the source — but only when it
  // is somewhere else than the source itself.
  const detailUrl = isSafeUrl(c.detail_url) && c.detail_url !== c.source_url ? c.detail_url : null;
  return [
    detailUrl ? `<a class="link" href="${escapeHTML(detailUrl)}" target="_blank" rel="noopener">Details ↗</a>` : "",
    safeUrl ? `<a class="link${detailUrl ? " secondary" : ""}" href="${escapeHTML(safeUrl)}" target="_blank" rel="noopener">Source ↗</a>` : ""
  ].filter(Boolean).join("");
}

function cardClasses(c, extra = "") {
  return ["card", extra, `loc-${c.location_tag || "none"}`, hitsOf(c).length ? "favorite" : "", c.status ? "flagged" : ""]
    .filter(Boolean).join(" ");
}

// One card, shared by every theme but the listings. A few parts — the ticket
// stub's reach and route, the Swiss month numeral — are always present and
// only shown by the theme that uses them.
function cardHTML(c) {
  const d = new Date(c.date + "T00:00:00");
  // City leads and is emphasised — it is what you scan for — with venue and
  // country trailing it.
  const whereHTML = [
    c.city ? `<span class="city">${escapeHTML(c.city)}</span>` : "",
    ...[c.venue, c.country].filter(Boolean).map(escapeHTML)
  ].filter(Boolean).join('<span class="sep"> · </span>');
  const linksHTML = linksOf(c);
  const route = c.location_tag === "berlin" ? "Berlin" : `Berlin → ${c.city || ""}`;
  return `
      <article class="${cardClasses(c)}" data-id="${escapeHTML(c.id || "")}" style="${artistStyle(c.artist)}">
        <div class="date-col">
          <div class="reach">${escapeHTML(REACH[c.location_tag] || "")}</div>
          <div class="mon">${MONTH_ABBR[d.getMonth()]}</div>
          <div class="day">${d.getDate()}</div>
          <div class="dow">${DOW[d.getDay()]}</div>
          <div class="route">${escapeHTML(route)}</div>
        </div>
        <div class="body">
          <div class="topline"><span class="artist">${escapeHTML(c.artist)}</span>${statusTagHTML(c)}${favoriteTagHTML(c)}${locationTagHTML(c.location_tag)}${instrumentTagsHTML(c)}</div>
          <div class="place">${whereHTML}</div>
          ${statusLineHTML(c)}
          ${c.program ? `<div class="program">${escapeHTML(c.program)}</div>` : ""}
          ${piecesHTML(c.pieces, hitsOf(c))}
        </div>
        ${linksHTML ? `<div class="links">${linksHTML}</div>` : ""}
      </article>`;
}

// The listings theme sets each concert as a paragraph, the way an arts page
// prints its listings. Every phrase in it is a field copied as stored: it
// never says who plays what, because a billing names the soloist and the
// programme names the works without saying the soloist is in all of them.
function listingHTML(c) {
  const d = new Date(c.date + "T00:00:00");
  const hits = hitsOf(c);
  let works = "";
  if (Array.isArray(c.pieces)) {
    const starred = new Map();
    for (const h of hits) {
      if (!starred.has(h.pieceIndex)) starred.set(h.pieceIndex, []);
      starred.get(h.pieceIndex).push(h.title);
    }
    works = c.pieces.map((p, i) => {
      if (typeof p !== "string" || !p.trim()) return "";
      const titles = starred.get(i);
      if (!titles) return `<span class="piece">${escapeHTML(p)}</span>`;
      const tip = `On your favorites list: ${titles.join("; ")}`;
      return `<span class="piece favorite" title="${escapeHTML(tip)}">${escapeHTML(p)}</span>`;
    }).filter(Boolean).join("; ");
  } else if (typeof c.pieces === "string" && c.pieces.trim()) {
    works = `<span class="note">${escapeHTML(c.pieces)}</span>`;
  }
  const where = [c.venue, c.city].filter(Boolean).map(escapeHTML).join(", ");
  return `
      <article class="${cardClasses(c, "listing")}" data-id="${escapeHTML(c.id || "")}">
        <p>${hits.length ? '<span class="lead-star">★ </span>' : ""}<strong class="artist">${escapeHTML(c.artist)}</strong>${statusTagHTML(c) ? " " + statusTagHTML(c) : ""}${c.program ? ` — ${escapeHTML(c.program)}.` : ""} ${works ? works + "." : ""} ${where}${where ? "." : ""} <span class="when">${DOW[d.getDay()]} ${d.getDate()} ${MONTH_ABBR[d.getMonth()]}</span>${linksOf(c)}</p>
        ${statusLineHTML(c)}
      </article>`;
}

// `pieces` is an array of work titles when the repertoire is known, or a
// descriptive string ("Programme not announced", "Composers only: Brahms")
// when the source doesn't list one. Only the array gets the "Programme"
// label: it heads a list of works that would otherwise be unlabelled chips.
// The string form already names itself, so labelling it produced a card
// reading "PROGRAMME / Programme not announced" — doubly odd directly under a
// `program` line that does say who is playing. It reads as prose instead
// (serif italic, muted), which is also how it differs from confirmed works.
//
// `hits` are the favorites found in this row, and they mark the individual
// works that matched — the tooltip names the curated entry, since a source's
// wording for it is often terser than the one you'd recognise.
function piecesHTML(pieces, hits = []) {
  if (Array.isArray(pieces)) {
    // Keyed by position in the original array: the chips below skip empty
    // entries, so a filtered index would star the wrong work.
    const starred = new Map();
    for (const h of hits) {
      if (!starred.has(h.pieceIndex)) starred.set(h.pieceIndex, []);
      starred.get(h.pieceIndex).push(h.title);
    }
    const chips = pieces.map((p, i) => {
      if (typeof p !== "string" || !p.trim()) return "";
      const titles = starred.get(i);
      if (!titles) return `<span class="piece">${escapeHTML(p)}</span>`;
      const tip = `On your favorites list: ${titles.join("; ")}`;
      return `<span class="piece favorite" title="${escapeHTML(tip)}">${escapeHTML(p)}</span>`;
    }).filter(Boolean).join("");
    if (!chips) return "";
    return `<div class="repertoire"><span class="repertoire-label">Programme</span><div class="repertoire-list">${chips}</div></div>`;
  }
  if (typeof pieces === "string" && pieces.trim()) {
    return `<div class="repertoire note"><span class="repertoire-text">${escapeHTML(pieces)}</span></div>`;
  }
  return "";
}

function piecesText(pieces) {
  if (Array.isArray(pieces)) return pieces.filter(p => typeof p === "string").join(" ");
  return typeof pieces === "string" ? pieces : "";
}

function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, s => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[s]));
}

function isSafeUrl(url) {
  if (typeof url !== "string") return false;
  try {
    const parsed = new URL(url, window.location.href);
    return parsed.protocol === "http:" || parsed.protocol === "https:";
  } catch {
    return false;
  }
}

async function fetchJSON(path) {
  const res = await fetch(path, { cache: "no-store" });
  if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
  return res.json();
}

async function init() {
  // Both of these are supporting data: if either can't be loaded, the concert
  // list still renders and only its own control drops out.
  const roster = fetchJSON("artists.json").catch(e => {
    console.error(e);
    return null;
  });
  const starred = fetchJSON("favorites.json").catch(e => {
    console.error(e);
    return null;
  });
  try {
    const data = await fetchJSON("seen.json");
    allConcerts = data.concerts || [];
    const [artists, favoritesFile] = await Promise.all([roster, starred]);
    loadRoster((artists && artists.artists) || []);
    artistOrder = ((artists && artists.artists) || []).map(a => a.name).filter(n => typeof n === "string");
    favorites = parseFavorites((favoritesFile && favoritesFile.favorites) || []);
    indexFavorites(allConcerts);
    populateFilters(allConcerts);
    populateFavoriteFilter();
    render();
  } catch (e) {
    document.getElementById("main").innerHTML =
      '<div class="empty">Could not load seen.json.</div>';
    document.getElementById("subtitle").textContent = "Error";
    console.error(e);
  }
}

document.getElementById("artistFilter").addEventListener("change", render);
document.getElementById("instrumentFilter").addEventListener("change", render);
document.getElementById("favoriteFilter").addEventListener("change", render);
document.getElementById("countryFilter").addEventListener("change", render);
document.getElementById("searchBox").addEventListener("input", render);
document.getElementById("themePicker").addEventListener("change", e => {
  applyTheme(e.target.value, { save: true });
  render();
});
document.getElementById("viz").addEventListener("click", onVizClick);

populateThemePicker();
applyTheme(savedThemeId());
init();
</script>
</body>
